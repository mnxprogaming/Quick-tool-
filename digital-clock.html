<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Clock - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
}

.clock{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    border-radius:20px;
    padding:40px 20px;
    text-align:center;
    color:white;
    margin-bottom:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.time{
    font-size:56px;
    font-weight:bold;
    font-family:monospace;
    margin-bottom:15px;
    letter-spacing:2px;
}

.date{
    font-size:18px;
    opacity:0.95;
}

.info{
    text-align:center;
    padding:18px;
    border-radius:15px;
    background:#f5f3ff;
    color:#555;
    font-size:14px;
    margin-bottom:20px;
}

.toggle{
    width:100%;
    border:none;
    padding:14px;
    border-radius:15px;
    background:#eeeaff;
    color:#6c5ce7;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.toggle:active{
    transform:scale(.98);
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .time{
        font-size:42px;
    }

    .date{
        font-size:14px;
    }

}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .info{
    background:#242039;
    color:#aeb4c8;
}

body.dark .toggle{
    background:#242039;
    color:#aaa5ff;
}

/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}

</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">⚡ Quick Tool</div>

    </div>

</div>


<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🕐</div>

        <h1>Digital Clock</h1>

        <p>
            View the current time and date instantly.
        </p>

    </div>


    <div class="clock">

        <div class="time" id="time">
            00:00:00
        </div>

        <div class="date" id="date">
            Loading...
        </div>

    </div>


    <div class="info">

        🌍 Your device's local time

    </div>


    <button class="toggle" onclick="toggleFormat()">
        Switch to 12-Hour Format
    </button>

</div>

<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>



<script>

let is24Hour = true;


function updateClock(){

    const now = new Date();

    let options = {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: !is24Hour
    };

    document.getElementById("time").textContent =
        now.toLocaleTimeString([], options);


    const dateOptions = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        now.toLocaleDateString([], dateOptions);

}


function toggleFormat(){

    is24Hour = !is24Hour;

    document.querySelector(".toggle").textContent =
        is24Hour
        ? "Switch to 12-Hour Format"
        : "Switch to 24-Hour Format";

    updateClock();

}


function goHome(){

    window.location.href = "index.html";

}


updateClock();

setInterval(updateClock,1000);
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
