<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSON Formatter - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.editor{
    margin-top:20px;
}

.editor label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

textarea{
    width:100%;
    min-height:260px;
    resize:vertical;
    padding:15px;
    border:2px solid #e2defd;
    border-radius:10px;
    outline:none;
    font-family:monospace;
    font-size:14px;
    line-height:1.5;
}

textarea:focus{
    border-color:#6c5ce7;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.action-btn{
    flex:1;
    border:0;
    padding:14px;
    border-radius:15px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.format-btn{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
}

.clear-btn{
    background:#eeeaff;
    color:#6c5ce7;
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:17px;
    text-align:center;
    font-size:14px;
    line-height:1.6;
}

.success{
    background:#eafff7;
    color:#008f6d;
}

.error{
    background:#fff0f0;
    color:#d63031;
}

.info{
    margin-top:18px;
    padding:15px;
    border-radius:17px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
}

.dark{
    background:#101321;
    color:white;
}

.dark .box{
    background:#191d2d;
}

.dark .title p{
    color:#aaa;
}

.dark textarea{
    background:#15192a;
    color:white;
    border-color:#8075ef;
}

.dark .clear-btn{
    background:#242039;
    color:white;
}

.dark .info{
    background:#242039;
}

.dark .success{
    background:#102b25;
    color:#66e6c1;
}

.dark .error{
    background:#321c20;
    color:#ff8c8c;
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .buttons{
        flex-direction:column;
    }

}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">⚡ Quick Tool</div>

    </div>

</div>


<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🧩</div>

        <h1>JSON Formatter</h1>

        <p>
            Format, validate and beautify your JSON data.
        </p>

    </div>


    <div class="editor">

        <label>Enter JSON</label>

        <textarea
            id="jsonInput"
            placeholder='Example:
{"name":"Neeraj","age":20,"city":"Delhi"}'></textarea>

    </div>


    <div class="buttons">

        <button class="action-btn format-btn"
                onclick="formatJSON()">
            ✨ Format JSON
        </button>

        <button class="action-btn clear-btn"
                onclick="clearJSON()">
            Clear
        </button>

    </div>


    <div class="result"
         id="result">
    </div>


    <div class="info">

        🔒 Your JSON is processed only in your browser.

    </div>

</div>

<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>



<script>

function formatJSON(){

    const input =
        document.getElementById("jsonInput").value.trim();

    const result =
        document.getElementById("result");


    if(!input){

        result.className = "result error";
        result.textContent = "Please enter JSON data.";
        result.style.display = "block";

        return;
    }


    try{

        const parsed = JSON.parse(input);

        const formatted =
            JSON.stringify(parsed,null,4);

        document.getElementById("jsonInput").value =
            formatted;

        result.className = "result success";
        result.textContent =
            "✅ Valid JSON — formatted successfully.";

        result.style.display = "block";

    }
    catch(error){

        result.className = "result error";

        result.textContent =
            "❌ Invalid JSON: " + error.message;

        result.style.display = "block";

    }

}


function clearJSON(){

    document.getElementById("jsonInput").value = "";

    document.getElementById("result").style.display =
        "none";

}


function goHome(){

    window.location.href = "tool.html";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
