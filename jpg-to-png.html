<style>

    margin-bottom:8px;

    font-size:14px;
}

.upload{
    display:block;
    text-align:center;
    border:2px dashed #6c5ce7;
    border-radius:10px;
    padding:35px 15px;
    background:#faf9ff;
    cursor:pointer;
}

    margin-bottom:10px;
}

.upload strong{
    display:block;
    margin-bottom:7px;
}

.upload small{
    color:#888;
}

#file{
    display:none;
}

.preview{
    display:none;
    margin-top:22px;
    text-align:center;
}

.preview img{
    max-width:100%;
    max-height:300px;
    border-radius:10px;
}

.info{
    display:none;
    margin-top:18px;

    display:none;
    width:100%;
    border:0;
    margin-top:20px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);

    padding:14px 25px;

</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<header class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</header>

<main class="container">

<div class="box">

<div class="title">

    <div class="icon">🔄</div>

    <h1>JPG → PNG</h1>

    <p>
        Convert your JPG image to PNG format instantly.
    </p>

</div>

<label class="upload" for="file">

    <div class="upload-icon">🖼️</div>

    <strong>Choose JPG Image</strong>

    <small>JPG or JPEG</small>

</label>

<input
    type="file"
    id="file"
    accept="image/jpeg"
>

<div class="preview" id="preview">

    <img id="previewImg">

</div>

<div class="info" id="info"></div>

<button
    class="convert"
    id="convertBtn"
    onclick="convertImage()">

    🔄 Convert to PNG

</button>

<div class="result" id="result">

    <h2>✅ Conversion Complete</h2>

    <p id="resultInfo"></p>

    <a
        id="download"
        class="download"
        download="converted-image.png">

        ⬇️ Download PNG

    </a>

</div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</main>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

let selectedFile=null;

document.getElementById("file").addEventListener("change",function(){

    const file=this.files[0];

    if(!file) return;

    selectedFile=file;

    const url=URL.createObjectURL(file);

    document.getElementById("previewImg").src=url;

    document.getElementById("preview").style.display="block";

    document.getElementById("convertBtn").style.display="block";

    document.getElementById("result").style.display="none";

    document.getElementById("info").innerHTML=
        "📄 File: <b>"+file.name+
        "</b><br>📦 Size: <b>"+
        formatSize(file.size)+"</b>";

    document.getElementById("info").style.display="block";

});

function convertImage(){

    if(!selectedFile){

        alert("Please choose a JPG image first.");

        return;
    }

    const img=new Image();

    img.onload=function(){

        const canvas=document.createElement("canvas");

        canvas.width=img.width;
        canvas.height=img.height;

        const ctx=canvas.getContext("2d");

        ctx.drawImage(img,0,0);

        canvas.toBlob(function(blob){

            const url=URL.createObjectURL(blob);

            document.getElementById("download").href=url;

            document.getElementById("resultInfo").innerHTML=
                "PNG image created successfully.<br>"+
                "Size: <b>"+formatSize(blob.size)+"</b>";

            document.getElementById("result").style.display="block";

            document.getElementById("result").scrollIntoView({
                behavior:"smooth"
            });

        },"image/png");

    };

    img.src=URL.createObjectURL(selectedFile);

}

function formatSize(bytes){

    if(bytes<1024)
        return bytes+" B";

    if(bytes<1024*1024)
        return (bytes/1024).toFixed(1)+" KB";

    return (bytes/(1024*1024)).toFixed(2)+" MB";
}

function goHome(){

    window.location.href="tool.html";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
