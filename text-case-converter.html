<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Case Converter - Quick Tool</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

textarea{
    width:100%;
    min-height:230px;
    resize:vertical;
    border:2px solid #e2e2ed;
    border-radius:10px;
    padding:16px;
    font-size:16px;
    font-family:Arial,sans-serif;
    outline:none;
    color:#172033;
    background:#faf9ff;
}

textarea:focus{
    border-color:#6c5ce7;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.action-btn{
    border:none;
    padding:14px 10px;
    border-radius:15px;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.purple{
    background:#6c5ce7;
}

.green{
    background:#00b894;
}

.orange{
    background:#e67e22;
}

.blue{
    background:#3498db;
}

.info{
    margin-top:18px;
    padding:15px;
    border-radius:17px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    color:#555;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin:0 0 10px;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark textarea{
    background:#15192a;
    color:white;
    border-color:#444;
}

body.dark .info{
    background:#242039;
    color:#ccc;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-info{
    color:#ccc;
}

@media(max-width:500px){
    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    textarea{
        min-height:200px;
    }

    .actions{
        grid-template-columns:1fr;
    }
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</div>

<div class="container">
<div class="box">

    <div class="title">
        <div class="title-icon">🔤</div>

        <h1>Text Case Converter</h1>

        <p>Convert your text into different letter cases instantly.</p>
    </div>

    <textarea id="text" placeholder="Type or paste your text here..."></textarea>

    <div class="actions">

        <button class="action-btn purple" onclick="upperCase()">
            UPPERCASE
        </button>

        <button class="action-btn green" onclick="lowerCase()">
            lowercase
        </button>

        <button class="action-btn orange" onclick="titleCase()">
            Title Case
        </button>

        <button class="action-btn blue" onclick="sentenceCase()">
            Sentence case
        </button>

        <button class="action-btn purple" onclick="copyText()">
            📋 Copy
        </button>

        <button class="action-btn green" onclick="clearText()">
            🗑️ Clear
        </button>

    </div>

    <div class="info" id="info">
        Characters: 0 &nbsp; | &nbsp; Words: 0
    </div>

    <div class="result" id="result" style="display:none;">

        <h2>Text Updated</h2>

        <div class="result-info">
            Your text has been converted successfully.
        </div>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

function goHome(){
    window.location.href="tool.html";
}

const textBox=document.getElementById("text");

textBox.addEventListener("input",updateInfo);

function updateInfo(){

    const text=textBox.value;

    const words=text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    document.getElementById("info").innerHTML=
        "Characters: "+text.length+
        " &nbsp; | &nbsp; Words: "+words;
}

function showResult(){
    document.getElementById("result").style.display="block";
    updateInfo();
}

function upperCase(){
    textBox.value=textBox.value.toUpperCase();
    showResult();
}

function lowerCase(){
    textBox.value=textBox.value.toLowerCase();
    showResult();
}

function titleCase(){

    textBox.value=textBox.value
        .toLowerCase()
        .replace(/\b\w/g,function(char){
            return char.toUpperCase();
        });

    showResult();
}

function sentenceCase(){

    let text=textBox.value.toLowerCase();

    text=text.replace(
        /(^\s*\w|[.!?]\s+\w)/g,
        function(match){
            return match.toUpperCase();
        }
    );

    textBox.value=text;

    showResult();
}

async function copyText(){

    if(!textBox.value){
        alert("Please enter some text first.");
        return;
    }

    try{

        await navigator.clipboard.writeText(textBox.value);

        alert("Text copied!");

    }catch(error){

        textBox.select();
        document.execCommand("copy");

        alert("Text copied!");
    }
}

function clearText(){

    textBox.value="";

    document.getElementById("result").style.display="none";

    updateInfo();
}

updateInfo();
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
