<style>

    max-width:750px;

    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(30,40,80,.10);
}

    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

    margin-top:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    padding:15px;
    border:2px solid #e3e0f5;
    border-radius:17px;
    outline:none;
    font-size:15px;
    background:#faf9ff;

select:focus{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

.action{

    padding:15px;
    border-radius:16px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:15px;

    cursor:pointer;

.secondary{
    background:#eeeaff;
    color:#5b4dcc;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;

.result h2{
    color:#00a77d;
    font-size:20px;
    margin:0 0 15px;

.result-box{

    border-radius:15px;
    padding:12px;
    margin-top:10px;

<link rel="stylesheet" href="tool-suggestions.css">

</head>

<body>

<header class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</header>

<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🔢</div>

        <h1>Number Base Converter</h1>

        <p>
            Convert numbers between Binary, Decimal, Octal and Hexadecimal.
        </p>

    </div>

    <div class="field">

        <label for="fromBase">From</label>

        <select id="fromBase">

            <option value="2">Binary (Base 2)</option>
            <option value="10" selected>Decimal (Base 10)</option>
            <option value="8">Octal (Base 8)</option>
            <option value="16">Hexadecimal (Base 16)</option>

        </select>

    </div>

    <div class="field">

        <label for="toBase">To</label>

        <select id="toBase">

            <option value="2">Binary (Base 2)</option>
            <option value="10">Decimal (Base 10)</option>
            <option value="8">Octal (Base 8)</option>
            <option value="16" selected>Hexadecimal (Base 16)</option>

        </select>

    </div>

    <div class="field">

        <label for="number">Number</label>

        <input
            type="text"
            id="number"
            placeholder="Example: 255"
            autocomplete="off"
        >

    </div>

    <div class="actions">

        <button class="action" onclick="convertNumber()">
            Convert
        </button>

        <button class="action secondary" onclick="swapBases()">
            ⇄ Swap
        </button>

        <button class="action secondary" onclick="copyResult()">
            📋 Copy Result
        </button>

        <button class="action secondary" onclick="clearAll()">
            🗑️ Clear
        </button>

    </div>

    <div class="result" id="result">

        <h2>Conversion Result</h2>

        <div class="result-box" id="resultBox"></div>

    </div>

</div>

<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

function goHome(){
    window.location.href="tool.html";
}

function convertNumber(){

    const input=document.getElementById("number").value.trim();

    const fromBase=Number(
        document.getElementById("fromBase").value
    );

    const toBase=Number(
        document.getElementById("toBase").value
    );

    if(!input){
        showResult("Enter a number first.");
        return;
    }

    let clean=input;

    if(fromBase===16){
        clean=clean.replace(/^0x/i,"");
    }

    const patterns={
        2:/^[01]+$/,
        8:/^[0-7]+$/,
        10:/^\d+$/,
        16:/^[0-9a-fA-F]+$/
    };

    if(!patterns[fromBase].test(clean)){
        showResult("Invalid number for the selected base.");
        return;
    }

    try{

        const decimal=BigInt(
            parseInt(clean,fromBase)
        );

        let result;

        if(toBase===10){
            result=decimal.toString(10);
        }
        else{
            result=decimal.toString(toBase).toUpperCase();
        }

        document.getElementById("resultBox").textContent=result;

        document.getElementById("result").style.display="block";

    }catch(error){

        showResult("Unable to convert this number.");

    }
}

function swapBases(){

    const from=document.getElementById("fromBase");
    const to=document.getElementById("toBase");

    const temp=from.value;

    from.value=to.value;
    to.value=temp;

    const number=document.getElementById("number");

    if(number.value.trim()){
        convertNumber();
    }
}

function copyResult(){

    const result=document.getElementById("resultBox").textContent;

    if(!result){
        showResult("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(result)
    .then(()=>{
        document.getElementById("result").style.display="block";
        document.getElementById("resultBox").textContent=
            result + "\n\n✓ Copied to clipboard!";
    })
    .catch(()=>{
        showResult("Copy failed. Please copy manually.");
    });
}

function clearAll(){

    document.getElementById("number").value="";
    document.getElementById("result").style.display="none";
    document.getElementById("resultBox").textContent="";
}

function showResult(message){

    document.getElementById("result").style.display="block";
    document.getElementById("resultBox").textContent=message;
}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
