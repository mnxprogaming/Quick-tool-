<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch - Quick Tool</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.timer{
    text-align:center;
    font-size:48px;
    font-weight:800;
    letter-spacing:2px;
    margin:25px 0;
    font-variant-numeric:tabular-nums;
}

.milliseconds{
    font-size:24px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.action-btn{
    border:none;
    padding:15px;
    border-radius:16px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.start{
    background:#00b894;
}

.pause{
    background:#e67e22;
}

.reset{
    background:#e74c3c;
}

.lap{
    background:#6c5ce7;
}

.laps{
    margin-top:25px;
    display:none;
}

.laps h2{
    font-size:19px;
    margin-bottom:12px;
}

.lap-item{
    display:flex;
    justify-content:space-between;
    padding:12px 14px;
    margin-bottom:8px;
    border-radius:12px;
    background:#f5f3ff;
    font-size:14px;
}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .lap-item{
    background:#242039;
}

@media(max-width:500px){
    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .timer{
        font-size:36px;
    }

    .milliseconds{
        font-size:20px;
    }

    .actions{
        grid-template-columns:1fr;
    }
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</div>

<div class="container">
<div class="box">

    <div class="title">
        <div class="title-icon">⏱️</div>

        <h1>Stopwatch</h1>

        <p>Use a precise stopwatch with lap timing.</p>
    </div>

    <div class="timer">
        <span id="time">00:00:00</span>
        <span class="milliseconds" id="ms">.00</span>
    </div>

    <div class="actions">

        <button class="action-btn start"
                id="startBtn"
                onclick="startStopwatch()">
            ▶ Start
        </button>

        <button class="action-btn pause"
                onclick="pauseStopwatch()">
            ⏸ Pause
        </button>

        <button class="action-btn reset"
                onclick="resetStopwatch()">
            🔄 Reset
        </button>

        <button class="action-btn lap"
                onclick="addLap()">
            🏁 Lap
        </button>

    </div>

    <div class="laps" id="laps">

        <h2>Lap Times</h2>

        <div id="lapList"></div>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

function goHome(){
    window.location.href="tool.html";
}

let startTime=0;
let elapsed=0;
let timer=null;
let running=false;
let lapNumber=0;

function startStopwatch(){

    if(running){
        return;
    }

    startTime=Date.now()-elapsed;
    running=true;

    timer=setInterval(updateStopwatch,10);

    document.getElementById("startBtn").textContent="▶ Running";
}

function pauseStopwatch(){

    if(!running){
        return;
    }

    elapsed=Date.now()-startTime;
    running=false;

    clearInterval(timer);

    timer=null;

    document.getElementById("startBtn").textContent="▶ Start";
}

function resetStopwatch(){

    running=false;

    clearInterval(timer);

    timer=null;

    elapsed=0;
    startTime=0;
    lapNumber=0;

    document.getElementById("time").textContent="00:00:00";
    document.getElementById("ms").textContent=".00";

    document.getElementById("startBtn").textContent="▶ Start";

    document.getElementById("lapList").innerHTML="";
    document.getElementById("laps").style.display="none";
}

function updateStopwatch(){

    elapsed=Date.now()-startTime;

    displayTime(elapsed);
}

function displayTime(milliseconds){

    const totalSeconds=Math.floor(milliseconds/1000);

    const hours=Math.floor(totalSeconds/3600);

    const minutes=Math.floor((totalSeconds%3600)/60);

    const seconds=totalSeconds%60;

    const hundredths=Math.floor((milliseconds%1000)/10);

    document.getElementById("time").textContent=
        pad(hours)+":"+pad(minutes)+":"+pad(seconds);

    document.getElementById("ms").textContent=
        "."+pad(hundredths);
}

function pad(number){

    return String(number).padStart(2,"0");
}

function addLap(){

    if(!running && elapsed===0){
        alert("Start the stopwatch first.");
        return;
    }

    lapNumber++;

    const total=running
        ? Date.now()-startTime
        : elapsed;

    const hours=Math.floor(total/3600000);
    const minutes=Math.floor((total%3600000)/60000);
    const seconds=Math.floor((total%60000)/1000);
    const hundredths=Math.floor((total%1000)/10);

    const lapTime=
        pad(hours)+":"+pad(minutes)+":"+pad(seconds)+
        "."+pad(hundredths);

    const item=document.createElement("div");

    item.className="lap-item";

    item.innerHTML=
        "<strong>Lap "+lapNumber+"</strong>"+
        "<span>"+lapTime+"</span>";

    document.getElementById("lapList")
        .prepend(item);

    document.getElementById("laps")
        .style.display="block";
}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
