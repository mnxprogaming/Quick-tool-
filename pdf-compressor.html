<style>

<body>
<header class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</header>

<main class="container">
<div class="box">
    <div class="title">
        <div class="title-icon">📄</div>
        <h1>PDF Compressor</h1>
        <p>Reduce PDF size directly in your browser.</p>
    </div>

    <label class="upload" for="file">
        <div class="upload-icon">📄</div>
        <strong>Choose PDF</strong>
        <small>PDF file • Max recommended 20MB</small>
    </label>
    <input type="file" id="file" accept="application/pdf">

    <div class="info" id="info"></div>

    <div class="settings" id="settings">
        <label>Compression Level: <span id="qualityValue" class="quality-value">60%</span></label>
        <input type="range" id="quality" min="20" max="90" value="60">

        <div class="manual-title">📦 Manual Target Size</div>
        <div class="manual-row">
            <input type="number" id="targetSize" min="1" step="1" placeholder="Example: 500">
            <select id="targetUnit">
                <option value="KB">KB</option>
                <option value="MB">MB</option>
            </select>
        </div>
        <div class="manual-help">Enter target size if you want a specific output size. Leave empty to use the quality slider.</div>
    </div>

    <button class="compress-btn" id="compressBtn" onclick="compressPDF()">Compress PDF</button>

    <div class="result" id="result">
        <h2>✅ Compression Complete</h2>
        <div class="result-info" id="resultInfo"></div>
        <a id="download" class="download" download="quicktool-compressed.pdf">⬇️ Download PDF</a>
    </div>
</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</main>

<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

    </div>

<script>
let selectedFile = null;
let downloadUrl = null;

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* FORMAT FILE NAME FUNCTION */
function formatFileName(name, maxLength = 25) {
    if (name.length <= maxLength) return name;
    const ext = name.substring(name.lastIndexOf("."));
    const baseName = name.substring(0, name.lastIndexOf("."));
    return baseName.substring(0, maxLength - ext.length - 3) + "..." + ext;
}

/* FILE SELECT */
document.getElementById("file").addEventListener("change", function(){
    const file = this.files[0];
    if(!file) return;
    if(file.type !== "application/pdf"){
        alert("Please choose a PDF file.");
        this.value = "";
        return;
    }
    if(file.size > 20 * 1024 * 1024){
        alert("Please choose a PDF smaller than 20MB.");
        this.value = "";
        return;
    }

    selectedFile = file;
    const shortName = formatFileName(file.name, 25);

    document.getElementById("info").innerHTML = 
        "📄 File: <b>" + shortName + "</b><br>" +
        "📦 Original Size: <b>" + formatSize(file.size) + "</b>";

    document.getElementById("info").style.display = "block";
    document.getElementById("settings").style.display = "block";
    document.getElementById("compressBtn").style.display = "block";
    document.getElementById("result").style.display = "none";
});

/* SLIDER */
document.getElementById("quality").addEventListener("input", function(){
    document.getElementById("qualityValue").innerText = this.value + "%";
});

/* COMPRESS */
async function compressPDF(){
    if(!selectedFile){
        alert("Please select a PDF first.");
        return;
    }

    const button = document.getElementById("compressBtn");
    button.innerText = "⏳ Compressing...";
    button.disabled = true;

    try {
        const arrayBuffer = await selectedFile.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
        const quality = parseInt(document.getElementById("quality").value) / 100;
        const targetInput = document.getElementById("targetSize").value.trim();
        let blob;

        if(targetInput){
            const targetNumber = parseFloat(targetInput);
            if(!targetNumber || targetNumber <= 0){
                alert("Please enter a valid target size.");
                return;
            }
            const targetUnit = document.getElementById("targetUnit").value;
            const targetBytes = targetUnit === "MB" ? targetNumber * 1024 * 1024 : targetNumber * 1024;
            blob = await compressToTarget(pdf, targetBytes, quality);
        } else {
            blob = await buildCompressedPDF(pdf, quality, 1.5);
        }

        if(!blob) throw new Error("No compressed PDF created.");
        if(downloadUrl) URL.revokeObjectURL(downloadUrl);

        downloadUrl = URL.createObjectURL(blob);
        const download = document.getElementById("download");
        download.href = downloadUrl;
        download.download = "quicktool-compressed.pdf";

        const saving = selectedFile.size > blob.size ? ((selectedFile.size - blob.size) / selectedFile.size * 100).toFixed(1) : 0;

        document.getElementById("resultInfo").innerHTML =
            "Original Size: <b>" + formatSize(selectedFile.size) + "</b><br>" +
            "Compressed Size: <b>" + formatSize(blob.size) + "</b><br>" +
            "Pages: <b>" + pdf.numPages + "</b><br>" +
            "Size Saved: <b>" + saving + "%</b>";

        document.getElementById("result").style.display = "block";
        document.getElementById("result").scrollIntoView({behavior:"smooth"});
    } catch(error) {
        console.error(error);
        alert("PDF compression failed. Please try another PDF.");
    } finally {
        button.innerText = " Compress PDF";
        button.disabled = false;
    }
}

/* BUILD COMPRESSED PDF */
async function buildCompressedPDF(pdf, quality, scale){
    const pages = [];
    for(let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++){
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({scale:scale});
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(viewport.width));
        canvas.height = Math.max(1, Math.round(viewport.height));
        const ctx = canvas.getContext("2d");
        await page.render({canvasContext:ctx, viewport:viewport}).promise;
        const imageData = canvas.toDataURL("image/jpeg", quality);
        pages.push({image:imageData, width:canvas.width, height:canvas.height});
    }
    const pdfBytes = createPDF(pages);
    return new Blob([pdfBytes], {type:"application/pdf"});
}

/* TARGET SIZE COMPRESSION */
async function compressToTarget(pdf, targetBytes, startingQuality){
    const scales = [1.5, 1.3, 1.15, 1.0, 0.9, 0.8, 0.7, 0.6];
    const qualities = [startingQuality, 0.80, 0.70, 0.60, 0.50, 0.40, 0.30, 0.20, 0.10, 0.05];
    let bestUnder = null;
    let smallest = null;

    for(const scale of scales){
        for(const q of qualities){
            const quality = Math.min(startingQuality, q);
            const blob = await buildCompressedPDF(pdf, quality, scale);
            if(!smallest || blob.size < smallest.size) smallest = blob;
            if(blob.size <= targetBytes){
                if(!bestUnder || blob.size > bestUnder.size) bestUnder = blob;
            }
        }
    }
    return bestUnder || smallest;
}

/* PDF CREATOR */
function createPDF(pages){
    const objects = [];
    const offsets = [];
    let pdf = "%PDF-1.4\n";

    function addObject(content){
        const number = objects.length + 1;
        objects.push(number + " 0 obj\n" + content + "\nendobj\n");
        return number;
    }

    const pageObjects = [];
    const imageObjects = [];

    pages.forEach(function(page){
        const base64 = page.image.split(",")[1];
        const binary = atob(base64);
        const imageBytes = new Uint8Array(binary.length);
        for(let i = 0; i < binary.length; i++) imageBytes[i] = binary.charCodeAt(i);
        const imageNumber = objects.length + 1;
        objects.push({type:"image", number:imageNumber, bytes:imageBytes, width:page.width, height:page.height});
        imageObjects.push(imageNumber);
    });

    const pagesNumber = objects.length + pages.length + 2;

    pages.forEach(function(page,index){
        const imageNumber = imageObjects[index];
        const contentText = "q\n" + page.width + " 0 0 " + page.height + " 0 0 cm\n/Im" + index + " Do\nQ\n";
        const contentNumber = objects.length + 1;
        objects.push({type:"content", number:contentNumber, content:contentText});
        const pageNumber = objects.length + 1;
        objects.push({type:"page", number:pageNumber, contentNumber:contentNumber, imageNumber:imageNumber, width:page.width, height:page.height, pagesNumber:pagesNumber, index:index});
        pageObjects.push(pageNumber);
    });

    const catalogNumber = objects.length + 1;
    objects.push({type:"catalog", number:catalogNumber, pagesNumber:pagesNumber});
    objects.push({type:"pages", number:pagesNumber, kids:pageObjects});

    let output = "%PDF-1.4\n";
    const objectPositions = {};

    objects.forEach(function(obj){
        objectPositions[obj.number] = output.length;
        if(typeof obj === "string"){
            output += obj;
            return;
        }
        if(obj.type === "image"){
            output += obj.number + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + Math.round(obj.width) + " /Height " + Math.round(obj.height) + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + obj.bytes.length + " >>\nstream\n";
            for(let i=0; i<obj.bytes.length; i++) output += String.fromCharCode(obj.bytes[i]);
            output += "\nendstream\nendobj\n";
        }
        if(obj.type === "content"){
            output += obj.number + " 0 obj\n<< /Length " + obj.content.length + " >>\nstream\n" + obj.content + "endstream\nendobj\n";
        }
        if(obj.type === "page"){
            output += obj.number + " 0 obj\n<< /Type /Page /Parent " + obj.pagesNumber + " 0 R /MediaBox [0 0 " + Math.round(obj.width) + " " + Math.round(obj.height) + "] /Resources << /XObject << /Im" + obj.index + " " + obj.imageNumber + " 0 R >> >> /Contents " + obj.contentNumber + " 0 R >>\nendobj\n";
        }
        if(obj.type === "catalog"){
            output += obj.number + " 0 obj\n<< /Type /Catalog /Pages " + obj.pagesNumber + " 0 R >>\nendobj\n";
        }
        if(obj.type === "pages"){
            output += obj.number + " 0 obj\n<< /Type /Pages /Kids [" + obj.kids.map(n => n + " 0 R").join(" ") + "] /Count " + obj.kids.length + " >>\nendobj\n";
        }
    });

    const xref = output.length;
    output += "xref\n0 " + (objects.length + 1) + "\n0000000000 65535 f \n";
    
    objects.forEach(function(obj){
        const pos = objectPositions[obj.number] || 0;
        output += String(pos).padStart(10,"0") + " 00000 n \n";
    });

    output += "trailer\n<< /Size " + (objects.length + 1) + " /Root " + catalogNumber + " 0 R >>\nstartxref\n" + xref + "\n%%EOF";
    
    const bytes = new Uint8Array(output.length);
    for(let i=0; i<output.length; i++) bytes[i] = output.charCodeAt(i) & 255;
    return bytes;
}

/* SIZE */
function formatSize(bytes){
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

/* HOME */
function goHome(){
    window.location.href = "tool.html";
}

/* DARK MODE */
if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark");
}
</script>
