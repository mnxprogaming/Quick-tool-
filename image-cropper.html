<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Cropper - Quick Tool</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

/* MAIN */

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
    position:relative;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 10px 30px rgba(40,50,100,.10);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
}

/* UPLOAD */

.upload{
    display:block;
    text-align:center;
    border:2px dashed #6c5ce7;
    border-radius:10px;
    padding:35px 15px;
    background:#faf9ff;
    cursor:pointer;
    transition:.2s;
}

.upload:hover{
    background:#f1efff;
}

.upload-icon{
    font-size:45px;
    margin-bottom:10px;
}

.upload strong{
    display:block;
    font-size:17px;
    margin-bottom:7px;
}

.upload small{
    color:#888;
    font-size:12px;
}

#file{
    display:none;
}

/* PREVIEW */

.preview{
    display:none;
    margin-top:22px;
    text-align:center;
}

.preview-title{
    font-weight:bold;
    margin-bottom:12px;
}

.preview img{
    max-width:100%;
    max-height:300px;
    border-radius:10px;
    display:block;
    margin:auto;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

/* INFO */

.info{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:10px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    line-height:1.8
}

/* CROP SETTINGS */

.settings{
    display:none;
    margin-top:20px;
}

.settings-title{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

.crop-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.crop-field label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
}

.crop-field input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:1px;
    outline:none;
    font-size:14px;
    color:#172033;
}

.crop-field input:focus{
    border-color:#6c5ce7;
}

/* BUTTON */

.compress-btn{
    display:none;
    width:100%;
    border:none;
    margin-top:20px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.compress-btn:active{
    transform:scale(.98);
}

/* RESULT */

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin-bottom:10px;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
}

.download{
    display:inline-block;
    margin-top:15px;
    padding:14px 25px;
    border-radius:15px;
    background:#00b894;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* DARK MODE */

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .upload{
    background:#15192a;
    border-color:#8075ef;
}

body.dark .upload small{
    color:#aaa;
}

body.dark .info{
    background:#242039;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-info{
    color:#ccc;
}

body.dark .crop-field input{
    background:#15192a;
    color:white;
    border-color:#444;
}

/* MOBILE */

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .upload{
        padding:30px 10px;
    }
}

/* MANUAL CROP */
.crop-area{display:none;position:relative;width:100%;max-width:700px;margin:auto;overflow:hidden;border-radius:1px;background:#111;touch-action:none;user-select:none}
.crop-area img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;border-radius:0;box-shadow:none;pointer-events:none;user-select:none}
.crop-box{position:absolute;left:0;top:0;width:100%;height:100%;border:2px solid #2196f3;box-shadow:0 0 0 9999px rgba(0,0,0,.48);cursor:move;touch-action:none}
.crop-box::before{content:"";position:absolute;left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px solid rgba(33,150,243,.55);border-right:1px solid rgba(33,150,243,.55);pointer-events:none}
.crop-box::after{content:"";position:absolute;left:0;right:0;top:33.33%;bottom:33.33%;border-top:1px solid rgba(33,150,243,.55);border-bottom:1px solid rgba(33,150,243,.55);pointer-events:none}
.crop-handle{
    position:absolute;
    z-index:2;
    touch-action:none;
    background:transparent;
}

.crop-handle.tl{
    left:-3px;
    top:-3px;
    width:26px;
    height:26px;
    border-left:4px solid #2196f3;
    border-top:4px solid #2196f3;
    cursor:nwse-resize;
}

.crop-handle.tm{
    left:50%;
    top:-2px;
    width:30px;
    height:4px;
    transform:translateX(-50%);
    background:#2196f3;
    cursor:ns-resize;
}

.crop-handle.tr{
    right:-3px;
    top:-3px;
    width:26px;
    height:26px;
    border-right:4px solid #2196f3;
    border-top:4px solid #2196f3;
    cursor:nesw-resize;
}

.crop-handle.ml{
    left:-2px;
    top:50%;
    width:4px;
    height:30px;
    transform:translateY(-50%);
    background:#2196f3;
    cursor:ew-resize;
}

.crop-handle.mr{
    right:-2px;
    top:50%;
    width:4px;
    height:30px;
    transform:translateY(-50%);
    background:#2196f3;
    cursor:ew-resize;
}

.crop-handle.bl{
    left:-3px;
    bottom:-3px;
    width:26px;
    height:26px;
    border-left:4px solid #2196f3;
    border-bottom:4px solid #2196f3;
    cursor:nesw-resize;
}

.crop-handle.bm{
    left:50%;
    bottom:-2px;
    width:30px;
    height:4px;
    transform:translateX(-50%);
    background:#2196f3;
    cursor:ns-resize;
}

.crop-handle.br{
    right:-3px;
    bottom:-3px;
    width:26px;
    height:26px;
    border-right:4px solid #2196f3;
    border-bottom:4px solid #2196f3;
    cursor:nwse-resize;
}
.manual-help{display:none;margin-top:10px;color:#777;font-size:12px;text-align:center}
body.dark .manual-help{color:#aaa}

/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>

<body>

<!-- HEADER -->

<header class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">
            ⚡ Quick Tool
        </div>

    </div>

</header>


<!-- MAIN -->

<main class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">
            ✂️
        </div>

        <h1>Image Cropper</h1>

        <p>
            Crop your image quickly and easily while keeping good quality.
        </p>

    </div>


    <!-- UPLOAD -->

    <label class="upload" for="file">

        <div class="upload-icon">
            🖼️
        </div>

        <strong>
            Choose Image
        </strong>

        <small>
            JPG, JPEG or PNG • Max recommended 10MB
        </small>

    </label>

    <input
        type="file"
        id="file"
        accept="image/jpeg,image/png,image/webp"
    >


    <!-- PREVIEW -->

    <div class="preview" id="preview">

        <div class="preview-title">
            Image Preview
        </div>

        <div class="crop-area" id="cropArea">
            <img id="previewImg" alt="Preview">
            <div class="crop-box" id="cropBox">
                <div class="crop-handle tl" data-handle="tl"></div>
                <div class="crop-handle tm" data-handle="tm"></div>
                <div class="crop-handle tr" data-handle="tr"></div>
                <div class="crop-handle ml" data-handle="ml"></div>
                <div class="crop-handle mr" data-handle="mr"></div>
                <div class="crop-handle bl" data-handle="bl"></div>
                <div class="crop-handle bm" data-handle="bm"></div>
                <div class="crop-handle br" data-handle="br"></div>
            </div>
        </div>
        <div class="manual-help" id="manualHelp">👆 Crop box ko drag ya corners/edges ko resize karein.</div>

    </div>


    <!-- INFO -->

    <div class="info" id="info"></div>


    <!-- CROP SETTINGS -->

    <div class="settings" id="settings">

        <label class="settings-title">
            Crop Settings
        </label>

        <div class="crop-grid">

            <div class="crop-field">

                <label>
                    X Position
                </label>

                <input
                    type="number"
                    id="cropX"
                    min="0"
                    value="0"
                >

            </div>


            <div class="crop-field">

                <label>
                    Y Position
                </label>

                <input
                    type="number"
                    id="cropY"
                    min="0"
                    value="0"
                >

            </div>


            <div class="crop-field">

                <label>
                    Width
                </label>

                <input
                    type="number"
                    id="cropWidth"
                    min="1"
                >

            </div>


            <div class="crop-field">

                <label>
                    Height
                </label>

                <input
                    type="number"
                    id="cropHeight"
                    min="1"
                >

            </div>

        </div>

    </div>


    <!-- CROP -->

    <button
        class="compress-btn"
        id="compressBtn"
        onclick="cropImage()"
    >
        ✂️ Crop Image
    </button>


    <!-- RESULT -->

    <div class="result" id="result">

        <h2>✅ Crop Complete</h2>

        <div
            class="result-info"
            id="resultInfo">
        </div>

        <a
            id="download"
            class="download"
            download="cropped-image.jpg">
            ⬇️ Download Image
        </a>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</main>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>

<script>

let selectedFile = null;
let originalImage = null;
let cropX=0,cropY=0,cropWidth=1,cropHeight=1;
let displayW=1,displayH=1;
let dragging=false,resizing=false,handleName=null;
let sx=0,sy=0,scx=0,scy=0,scw=1,sch=1;


/* FILE SELECT */

document.getElementById("file").addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    selectedFile = file;


    /* Check size */

    if(file.size > 10 * 1024 * 1024){

        alert("Please choose an image smaller than 10MB.");

        this.value = "";

        return;
    }


    const url =
        URL.createObjectURL(file);


    const img =
        new Image();


    img.onload = function(){

        originalImage = img;


        const preview =
            document.getElementById("preview");

        const previewImg =
            document.getElementById("previewImg");

        const info =
            document.getElementById("info");

        const settings =
            document.getElementById("settings");

        const compressBtn =
            document.getElementById("compressBtn");

        const result =
            document.getElementById("result");


        /* Preview */

        previewImg.src = url;

        preview.style.display = "block";
        document.getElementById("cropArea").style.display = "block";
        document.getElementById("manualHelp").style.display = "block";
        previewImg.onload = function(){ setupManualCrop(); resetManualCrop(); };


        /* File info */

        info.innerHTML =

            "📄 File: <b>" +
            file.name +
            "</b><br>" +

            "📦 Original Size: <b>" +
            formatSize(file.size) +
            "</b><br>" +

            "📐 Dimensions: <b>" +
            img.width +
            " × " +
            img.height +
            " px</b>";


        info.style.display = "block";


        /* Default crop = full image */

        document.getElementById("cropX").value = 0;

        document.getElementById("cropY").value = 0;

        document.getElementById("cropWidth").value =
            img.width;

        document.getElementById("cropHeight").value =
            img.height;


        settings.style.display = "block";

        compressBtn.style.display = "block";

        result.style.display = "none";

    };


    img.src = url;

});


/* MANUAL CROP */
function setupManualCrop(){
 const area=document.getElementById("cropArea"), box=document.getElementById("cropBox");
 displayW=area.clientWidth; displayH=area.clientHeight;
 box.onpointerdown=e=>{ if(e.target.classList.contains("crop-handle"))return; e.preventDefault(); dragging=true; resizing=false; sx=e.clientX; sy=e.clientY; scx=cropX; scy=cropY; scw=cropWidth; sch=cropHeight; };
 box.querySelectorAll(".crop-handle").forEach(h=>h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();resizing=true;dragging=false;handleName=h.dataset.handle;sx=e.clientX;sy=e.clientY;scx=cropX;scy=cropY;scw=cropWidth;sch=cropHeight;});
}
function resetManualCrop(){const a=document.getElementById("cropArea");displayW=a.clientWidth;displayH=a.clientHeight;cropX=0;cropY=0;cropWidth=displayW;cropHeight=displayH;updateCropBox();syncCropFields();}
function manualMove(e){if(!dragging&&!resizing)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(dragging){cropX=Math.max(0,Math.min(displayW-scw,scx+dx));cropY=Math.max(0,Math.min(displayH-sch,scy+dy));}
 else {let l=scx,t=scy,r=scx+scw,b=scy+sch,m=20;if(handleName.includes("l"))l=Math.max(0,Math.min(r-m,scx+dx));if(handleName.includes("r"))r=Math.min(displayW,Math.max(l+m,scx+scw+dx));if(handleName.includes("t"))t=Math.max(0,Math.min(b-m,scy+dy));if(handleName.includes("b"))b=Math.min(displayH,Math.max(t+m,scy+sch+dy));cropX=l;cropY=t;cropWidth=r-l;cropHeight=b-t;}
 updateCropBox();syncCropFields();}
function manualEnd(){dragging=false;resizing=false;handleName=null;}
function updateCropBox(){const b=document.getElementById("cropBox");b.style.left=cropX+"px";b.style.top=cropY+"px";b.style.width=cropWidth+"px";b.style.height=cropHeight+"px";}
function syncCropFields(){if(!originalImage)return;const x=originalImage.width/displayW,y=originalImage.height/displayH;document.getElementById("cropX").value=Math.round(cropX*x);document.getElementById("cropY").value=Math.round(cropY*y);document.getElementById("cropWidth").value=Math.max(1,Math.round(cropWidth*x));document.getElementById("cropHeight").value=Math.max(1,Math.round(cropHeight*y));}
function fieldsToCrop(){if(!originalImage)return;const a=document.getElementById("cropArea");displayW=a.clientWidth;displayH=a.clientHeight;const x=+document.getElementById("cropX").value||0,y=+document.getElementById("cropY").value||0,w=+document.getElementById("cropWidth").value||1,h=+document.getElementById("cropHeight").value||1;const sx=displayW/originalImage.width,sy=displayH/originalImage.height;cropX=Math.max(0,Math.min(displayW-20,x*sx));cropY=Math.max(0,Math.min(displayH-20,y*sy));cropWidth=Math.max(20,Math.min(displayW-cropX,w*sx));cropHeight=Math.max(20,Math.min(displayH-cropY,h*sy));updateCropBox();}
["cropX","cropY","cropWidth","cropHeight"].forEach(id=>document.getElementById(id).addEventListener("input",fieldsToCrop));
document.addEventListener("pointermove",manualMove);document.addEventListener("pointerup",manualEnd);document.addEventListener("pointercancel",manualEnd);
window.addEventListener("resize",()=>{if(originalImage)fieldsToCrop();});

/* CROP */

function cropImage(){

    if(!selectedFile || !originalImage){

        alert("Please select an image first.");

        return;
    }


    const x =
        parseInt(
            document.getElementById("cropX").value
        );

    const y =
        parseInt(
            document.getElementById("cropY").value
        );

    const width =
        parseInt(
            document.getElementById("cropWidth").value
        );

    const height =
        parseInt(
            document.getElementById("cropHeight").value
        );


    if(
        isNaN(x) ||
        isNaN(y) ||
        isNaN(width) ||
        isNaN(height)
    ){

        alert("Please enter valid crop values.");

        return;
    }


    if(
        x < 0 ||
        y < 0 ||
        width <= 0 ||
        height <= 0
    ){

        alert("Please enter valid crop values.");

        return;
    }


    if(x + width > originalImage.width){

        alert(
            "Crop width image ke andar hona chahiye."
        );

        return;
    }


    if(y + height > originalImage.height){

        alert(
            "Crop height image ke andar hona chahiye."
        );

        return;
    }


    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext("2d");


    ctx.drawImage(

        originalImage,

        x,
        y,
        width,
        height,

        0,
        0,
        width,
        height

    );


    canvas.toBlob(function(blob){

        if(!blob){

            alert("Cropping failed.");

            return;
        }


        const downloadUrl =
            URL.createObjectURL(blob);


        document.getElementById("download").href =
            downloadUrl;


        document.getElementById("download").download =
            "quicktool-cropped.jpg";


        document.getElementById("resultInfo").innerHTML =

            "Original Dimensions: <b>" +
            originalImage.width +
            " × " +
            originalImage.height +
            " px</b><br>" +

            "Cropped Dimensions: <b>" +
            width +
            " × " +
            height +
            " px</b><br>" +

            "Cropped Size: <b>" +
            formatSize(blob.size) +
            "</b>";


        document.getElementById("result").style.display =
            "block";


        document.getElementById("result").scrollIntoView({

            behavior:"smooth"

        });


    }, "image/jpeg", 0.92);

}


/* FILE SIZE */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(2) + " MB";

}


/* HOME */

function goHome(){

    window.location.href =
        "tool.html";

}


/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}

</script>

fetch("intro.html")

    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
