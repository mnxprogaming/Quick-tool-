    <div class="settings">

        <label>Date & Time</label>

        <select id="fromZone">
            <option value="Asia/Kolkata">India (IST)</option>
            <option value="UTC">UTC</option>
            <option value="America/New_York">New York</option>
            <option value="America/Los_Angeles">Los Angeles</option>
            <option value="Europe/London">London</option>
            <option value="Europe/Paris">Paris</option>
            <option value="Asia/Dubai">Dubai</option>
            <option value="Asia/Singapore">Singapore</option>
            <option value="Asia/Tokyo">Tokyo</option>
            <option value="Australia/Sydney">Sydney</option>
        </select>

        <label>To Time Zone</label>

        <select id="toZone">
            <option value="America/New_York">New York</option>
            <option value="Asia/Kolkata">India (IST)</option>
            <option value="UTC">UTC</option>
            <option value="America/Los_Angeles">Los Angeles</option>
            <option value="Europe/London">London</option>
            <option value="Europe/Paris">Paris</option>
            <option value="Asia/Dubai">Dubai</option>
            <option value="Asia/Singapore">Singapore</option>
            <option value="Asia/Tokyo">Tokyo</option>

        </select>

            🌍 Convert Time
        </button>

<script>

function goHome(){
    window.location.href="tool.html";
}

function pad(number){
    return String(number).padStart(2,"0");
}

function getOffsetMinutes(date,timeZone){

    const parts=new Intl.DateTimeFormat("en-US",{
        timeZone:timeZone,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23"
    }).formatToParts(date);

    const values={};

    parts.forEach(part=>{
        if(part.type!=="literal"){
            values[part.type]=part.value;
        }
    });

    const asUTC=Date.UTC(
        Number(values.year),
        Number(values.month)-1,
        Number(values.day),
        Number(values.hour),
        Number(values.minute),
        Number(values.second)
    );

    return (asUTC-date.getTime())/60000;
}

function zonedDateToUTC(value,timeZone){

    const [datePart,timePart]=value.split("T");

    const [year,month,day]=datePart.split("-").map(Number);
    const [hour,minute]=timePart.split(":").map(Number);

    const guess=Date.UTC(
        year,
        month-1,
        day,
        hour,
        minute,
        0
    );

    const first=new Date(guess);

    const offset=getOffsetMinutes(first,timeZone);

    return new Date(guess-offset*60000);
}

function getZoneName(zone){

    const names={
        "Asia/Kolkata":"India (IST)",
        "UTC":"UTC",
        "America/New_York":"New York",
        "America/Los_Angeles":"Los Angeles",
        "Europe/London":"London",
        "Europe/Paris":"Paris",
        "Asia/Dubai":"Dubai",
        "Asia/Singapore":"Singapore",
        "Asia/Tokyo":"Tokyo",
        "Australia/Sydney":"Sydney"
    };

    return names[zone] || zone;
}

function convertTime(){

    const input=document.getElementById("dateTime").value;
    const from=document.getElementById("fromZone").value;
    const to=document.getElementById("toZone").value;

    if(!input){
        alert("Please select date and time.");
        return;
    }

    try{

        const utcDate=zonedDateToUTC(input,from);

        const converted=new Intl.DateTimeFormat("en-IN",{
            timeZone:to,
            year:"numeric",
            month:"long",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }).format(utcDate);

        document.getElementById("resultTime").textContent=converted;

        document.getElementById("resultInfo").innerHTML=
            getZoneName(from)+
            " → "+
            getZoneName(to)+
            "<br>Converted using your browser's time-zone data.";

        document.getElementById("result").style.display="block";

    }catch(error){

        alert("Unable to convert this time.");

    }
}

function setCurrentTime(){

    const now=new Date();

    const local=new Date(
        now.getTime()-now.getTimezoneOffset()*60000
    );

    document.getElementById("dateTime").value=
        local.toISOString().slice(0,16);
}

setCurrentTime();
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
