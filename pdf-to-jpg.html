.preview{

    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:17px;
    background:#f5f3ff;

    font-size:14px;
}

.settings{
    display:none;
    margin-top:20px;
}

.settings label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

#quality{
    width:100%;

}

.convert-btn{
    display:none;
    width:100%;
    border:none;

    font-size:16px;

    cursor:pointer;

}

.result{
    display:none;

    padding:20px;

    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin-bottom:10px;
}

.result-info{
    color:#555;
    font-size:14px;

}

.download{

    margin-top:15px;
    padding:14px 25px;
    border-radius:15px;

<body>

<header class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">
            ⚡ Quick Tool
        </div>

    </div>

</header>


<main class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">
            📑
        </div>

        <h1>PDF to JPG</h1>

        <p>
            Convert PDF pages into JPG images quickly and easily.
        </p>

    </div>


    <label class="upload" for="file">

        <div class="upload-icon">
            📄
        </div>

        <strong>
            Choose PDF
        </strong>

        <small>
            PDF files • Convert pages to JPG
        </small>

    </label>

    <input
        type="file"
        id="file"
        accept="application/pdf"
    >


    <div class="preview" id="preview">

        <div class="preview-title">
            PDF Page Preview
        </div>

        <canvas id="previewCanvas"></canvas>

    </div>


    <div class="info" id="info"></div>


    <div class="settings" id="settings">

        <label>
            JPG Quality:
            <span id="qualityValue">90%</span>
        </label>

        <input
            type="range"
            id="quality"
            min="50"
            max="100"
            value="90"
        >

    </div>


    <button
        class="convert-btn"
        id="convertBtn"
        onclick="convertPDF()">

         Convert PDF to JPG

    </button>


    <div class="result" id="result">

        <h2>
            ✅ Conversion Complete
        </h2>

        <div
            class="result-info"
            id="resultInfo">
        </div>

        <a
            id="download"
            class="download"
            download="quicktool-page.jpg">

            ⬇️ Download JPG

        </a>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</main>

    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let selectedFile = null;
let pdfDocument = null;
let firstPageCanvas = null;


/* FILE SELECT */

document.getElementById("file").addEventListener("change", async function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    selectedFile = file;

    if(file.size > 20 * 1024 * 1024){

        alert("Please choose a PDF smaller than 20MB.");

        this.value = "";

        return;
    }

    try{

        const arrayBuffer =
            await file.arrayBuffer();

        pdfDocument =
            await pdfjsLib.getDocument({
                data:arrayBuffer
            }).promise;


        document.getElementById("info").innerHTML =

            "📄 File: <b>" +
            file.name +
            "</b><br>" +

            "📦 PDF Size: <b>" +
            formatSize(file.size) +
            "</b><br>" +

            "📑 Pages: <b>" +
            pdfDocument.numPages +
            "</b>";


        document.getElementById("info").style.display =
            "block";


        document.getElementById("settings").style.display =
            "block";


        document.getElementById("convertBtn").style.display =
            "block";


        document.getElementById("result").style.display =
            "none";


        await showPreview();

    }catch(error){

        console.error(error);

        alert("Could not read this PDF. Please try another PDF.");

        this.value = "";

    }

});


/* QUALITY */

document.getElementById("quality").addEventListener("input",function(){

    document.getElementById("qualityValue").innerText =
        this.value + "%";

});


/* PREVIEW */

async function showPreview(){

    const page =
        await pdfDocument.getPage(1);

    const viewport =
        page.getViewport({
            scale:1.3
        });


    const canvas =
        document.getElementById("previewCanvas");

    const context =
        canvas.getContext("2d");


    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;


    await page.render({

        canvasContext:context,
        viewport:viewport

    }).promise;


    document.getElementById("preview").style.display =
        "block";


    firstPageCanvas =
        canvas;

}


/* CONVERT */

async function convertPDF(){

    if(!pdfDocument){

        alert("Please choose a PDF first.");

        return;
    }


    const quality =
        parseInt(
            document.getElementById("quality").value
        ) / 100;


    const page =
        await pdfDocument.getPage(1);


    const viewport =
        page.getViewport({
            scale:2
        });


    const canvas =
        document.createElement("canvas");


    const context =
        canvas.getContext("2d");


    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;


    context.fillStyle =
        "white";

    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    await page.render({

        canvasContext:context,
        viewport:viewport

    }).promise;


    canvas.toBlob(function(blob){

        if(!blob){

            alert("Conversion failed.");

            return;
        }


        const url =
            URL.createObjectURL(blob);


        const download =
            document.getElementById("download");


        download.href =
            url;


        download.download =
            "quicktool-page-1.jpg";


        document.getElementById("resultInfo").innerHTML =

            "PDF Pages: <b>" +
            pdfDocument.numPages +
            "</b><br>" +

            "Converted Page: <b>1</b><br>" +

            "JPG Size: <b>" +
            formatSize(blob.size) +
            "</b>";


        document.getElementById("result").style.display =
            "block";


        document.getElementById("result").scrollIntoView({

            behavior:"smooth"

        });


    },"image/jpeg",quality);

}


/* FILE SIZE */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(2) + " MB";

}


/* HOME */

function goHome(){

    window.location.href =
        "tool.html";

}


/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}

</script>
