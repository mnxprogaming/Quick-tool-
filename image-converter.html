<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Converter - Quick Tool</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

/* MAIN */

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
    position:relative;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 10px 30px rgba(40,50,100,.10);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
}

/* UPLOAD */

.upload{
    display:block;
    text-align:center;
    border:2px dashed #6c5ce7;
    border-radius:10px;
    padding:35px 15px;
    background:#faf9ff;
    cursor:pointer;
    transition:.2s;
}

.upload:hover{
    background:#f1efff;
}

.upload-icon{
    font-size:45px;
    margin-bottom:10px;
}

.upload strong{
    display:block;
    font-size:17px;
    margin-bottom:7px;
}

.upload small{
    color:#888;
    font-size:12px;
}

#file{
    display:none;
}

/* PREVIEW */

.preview{
    display:none;
    margin-top:22px;
    text-align:center;
}

.preview-title{
    font-weight:bold;
    margin-bottom:12px;
}

.preview img{
    max-width:100%;
    max-height:300px;
    border-radius:10px;
    display:block;
    margin:auto;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

/* INFO */

.info{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:10px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    line-height:1.8
}

/* SETTINGS */

.settings{
    display:none;
    margin-top:20px;
}

.settings label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

.format-select{
    width:100%;
    padding:15px;
    border:2px solid #eeeaff;
    border-radius:15px;
    background:#faf9ff;
    color:#172033;
    font-size:15px;
    outline:none;
}

body.dark .format-select{
    background:#15192a;
    border-color:#34304f;
    color:white;
}

/* BUTTON */

.convert-btn{
    display:none;
    width:100%;
    border:none;
    margin-top:20px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.convert-btn:active{
    transform:scale(.98);
}

/* RESULT */

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin-bottom:10px;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
}

.download{
    display:inline-block;
    margin-top:15px;
    padding:14px 25px;
    border-radius:15px;
    background:#00b894;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* DARK MODE */

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .upload{
    background:#15192a;
    border-color:#8075ef;
}

body.dark .upload small{
    color:#aaa;
}

body.dark .info{
    background:#242039;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-info{
    color:#ccc;
}

/* MOBILE */

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .upload{
        padding:30px 10px;
    }

}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">
            ⚡ Quick Tool
        </div>

    </div>

</header>


<!-- MAIN -->

<main class="container">

<div class="box">


    <!-- TITLE -->

    <div class="title">

        <div class="title-icon">
            🖼️
        </div>

        <h1>Image Converter</h1>

        <p>
            Convert your images between JPG, PNG and WebP formats.
        </p>

    </div>


    <!-- UPLOAD -->

    <label class="upload" for="file">

        <div class="upload-icon">
            🖼️
        </div>

        <strong>
            Choose Image
        </strong>

        <small>
            JPG, JPEG, PNG or WebP • Max recommended 10MB
        </small>

    </label>

    <input
        type="file"
        id="file"
        accept="image/jpeg,image/png,image/webp"
    >


    <!-- PREVIEW -->

    <div class="preview" id="preview">

        <div class="preview-title">
            Image Preview
        </div>

        <img id="previewImg" alt="Preview">

    </div>


    <!-- INFO -->

    <div class="info" id="info"></div>


    <!-- SETTINGS -->

    <div class="settings" id="settings">

        <label>
            Convert To
        </label>

        <select
            id="format"
            class="format-select">

            <option value="image/jpeg">
                JPG
            </option>

            <option value="image/png">
                PNG
            </option>

            <option value="image/webp">
                WebP
            </option>

        </select>

    </div>


    <!-- CONVERT BUTTON -->

    <button
        class="convert-btn"
        id="convertBtn"
        onclick="convertImage()">

         Convert Image

    </button>


    <!-- RESULT -->

    <div class="result" id="result">

        <h2>
            ✅ Conversion Complete
        </h2>

        <div
            class="result-info"
            id="resultInfo">
        </div>

        <a
            id="download"
            class="download"
            download="quicktool-converted.jpg">

            ⬇️ Download Image

        </a>

    </div>


</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</main>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>

<script>

let selectedFile = null;


/* FILE SELECT */

document.getElementById("file").addEventListener("change",function(){

    const file = this.files[0];

    if(!file){
        return;
    }


    if(file.size > 10 * 1024 * 1024){

        alert("Please choose an image smaller than 10MB.");

        this.value = "";

        return;
    }


    selectedFile = file;


    const url =
        URL.createObjectURL(file);


    document.getElementById("previewImg").src =
        url;


    document.getElementById("preview").style.display =
        "block";


    document.getElementById("info").innerHTML =

        "📄 File: <b>" +
        file.name +
        "</b><br>" +

        "📦 Original Size: <b>" +
        formatSize(file.size) +
        "</b><br>" +

        "🖼️ Format: <b>" +
        getFormat(file.type) +
        "</b>";


    document.getElementById("info").style.display =
        "block";


    document.getElementById("settings").style.display =
        "block";


    document.getElementById("convertBtn").style.display =
        "block";


    document.getElementById("result").style.display =
        "none";

});


/* CONVERT */

function convertImage(){

    if(!selectedFile){

        alert("Please select an image first.");

        return;
    }


    const img =
        new Image();


    const url =
        URL.createObjectURL(selectedFile);


    img.onload = function(){

        const canvas =
            document.createElement("canvas");


        canvas.width =
            img.naturalWidth;

        canvas.height =
            img.naturalHeight;


        const ctx =
            canvas.getContext("2d");


        /*
        White background is used for JPG
        because JPG does not support transparency.
        */

        const format =
            document.getElementById("format").value;


        if(format === "image/jpeg"){

            ctx.fillStyle =
                "white";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

        }


        ctx.drawImage(
            img,
            0,
            0
        );


        let quality = 0.92;


        if(format === "image/png"){

            quality = undefined;

        }


        canvas.toBlob(function(blob){

            if(!blob){

                alert("Conversion failed.");

                return;
            }


            const downloadUrl =
                URL.createObjectURL(blob);


            const extension =
                getExtension(format);


            const download =
                document.getElementById("download");


            download.href =
                downloadUrl;


            download.download =
                "quicktool-converted." +
                extension;


            document.getElementById("resultInfo").innerHTML =

                "Original Format: <b>" +
                getFormat(selectedFile.type) +
                "</b><br>" +

                "Converted Format: <b>" +
                extension.toUpperCase() +
                "</b><br>" +

                "Original Size: <b>" +
                formatSize(selectedFile.size) +
                "</b><br>" +

                "New Size: <b>" +
                formatSize(blob.size) +
                "</b>";


            document.getElementById("result").style.display =
                "block";


            document.getElementById("result").scrollIntoView({

                behavior:"smooth"

            });


        },format,quality);

    };


    img.src = url;

}


/* FORMAT NAME */

function getFormat(type){

    if(type === "image/jpeg"){
        return "JPG";
    }

    if(type === "image/png"){
        return "PNG";
    }

    if(type === "image/webp"){
        return "WebP";
    }

    return "Image";

}


/* EXTENSION */

function getExtension(type){

    if(type === "image/jpeg"){
        return "jpg";
    }

    if(type === "image/png"){
        return "png";
    }

    if(type === "image/webp"){
        return "webp";
    }

    return "jpg";

}


/* FILE SIZE */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(2) + " MB";

}


/* HOME */

function goHome(){

    window.location.href =
        "tool.html";

}


/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}

</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
