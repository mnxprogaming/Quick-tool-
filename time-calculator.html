<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Calculator - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    font-family:Arial,sans-serif;
    padding-bottom:30px;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.input-group{
    margin-top:18px;
}

.input-group label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

.time-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.time-row input{
    width:100%;
    padding:15px 10px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
    text-align:center;
}

.time-row input:focus{
    border-color:#6c5ce7;
}

.action-btn{
    width:100%;
    border:0;
    margin-top:20px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.secondary{
    width:100%;
    border:0;
    margin-top:12px;
    padding:14px;
    border-radius:15px;
    background:#eeeaff;
    color:#5547c7;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin:0 0 10px;
}

.result-value{
    font-size:28px;
    font-weight:800;
    word-break:break-word;
    margin:12px 0;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
}

.copy{
    display:inline-block;
    margin-top:15px;
    padding:14px 25px;
    border-radius:15px;
    background:#00b894;
    color:white;
    border:0;
    font-weight:bold;
    cursor:pointer;
}

.info{
    margin-top:20px;
    padding:15px;
    border-radius:17px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    line-height:1.6;
}

.dark{
    background:#101321;
    color:white;
}

.dark .box{
    background:#191d2d;
}

.dark .title p{
    color:#aaa;
}

.dark .time-row input{
    background:#15192a;
    color:white;
    border-color:#33384d;
}

.dark .secondary{
    background:#242039;
    color:#aaa5ff;
}

.dark .info{
    background:#242039;
}

.dark .result{
    background:#102b25;
}

.dark .result-info{
    color:#ccc;
}

@media(max-width:500px){
    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .time-row{
        gap:7px;
    }

    .time-row input{
        padding:14px 5px;
    }
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</div>

<div class="container">
    <div class="box">

        <div class="title">
            <div class="title-icon">⏱️</div>

            <h1>Time Calculator</h1>

            <p>
                Add or subtract hours, minutes and seconds easily.
            </p>
        </div>

        <div class="input-group">

            <label>First Time</label>

            <div class="time-row">
                <input type="number" id="h1" placeholder="Hours" min="0">
                <input type="number" id="m1" placeholder="Minutes" min="0" max="59">
                <input type="number" id="s1" placeholder="Seconds" min="0" max="59">
            </div>

        </div>

        <div class="input-group">

            <label>Operation</label>

            <select id="operation"
                style="width:100%;padding:15px;border:1px solid #ddd;border-radius:15px;font-size:16px;outline:none;background:white;color:#172033;">

                <option value="add">Add (+)</option>
                <option value="subtract">Subtract (−)</option>

            </select>

        </div>

        <div class="input-group">

            <label>Second Time</label>

            <div class="time-row">
                <input type="number" id="h2" placeholder="Hours" min="0">
                <input type="number" id="m2" placeholder="Minutes" min="0" max="59">
                <input type="number" id="s2" placeholder="Seconds" min="0" max="59">
            </div>

        </div>

        <button class="action-btn" onclick="calculateTime()">
            Calculate Time
        </button>

        <button class="secondary" onclick="clearAll()">
            Clear
        </button>

        <div class="result" id="result">

            <h2>Result</h2>

            <div class="result-value" id="resultValue"></div>

            <div class="result-info" id="resultInfo"></div>

            <button class="copy" onclick="copyResult()">
                Copy Result
            </button>

        </div>

        <div class="info">
            <strong>Example:</strong><br>
            2 Hours 30 Minutes + 1 Hour 45 Minutes =
            <b>4 Hours 15 Minutes</b>
        </div>

    </div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

function goHome(){
    window.location.href="tool.html";
}


function getValue(id){

    const value = document.getElementById(id).value.trim();

    if(value === ""){
        return 0;
    }

    const number = Number(value);

    if(!Number.isFinite(number) || number < 0){
        throw new Error("Please enter valid time values.");
    }

    return number;
}


function validateTime(minutes, seconds){

    if(minutes > 59){
        throw new Error("Minutes must be between 0 and 59.");
    }

    if(seconds > 59){
        throw new Error("Seconds must be between 0 and 59.");
    }

}


function formatTime(totalSeconds){

    if(totalSeconds < 0){
        return "− " + formatTime(Math.abs(totalSeconds));
    }

    totalSeconds = Math.round(totalSeconds);

    const hours = Math.floor(totalSeconds / 3600);

    const minutes = Math.floor(
        (totalSeconds % 3600) / 60
    );

    const seconds = totalSeconds % 60;

    return hours + " Hours " +
           minutes + " Minutes " +
           seconds + " Seconds";
}


function calculateTime(){

    const resultBox = document.getElementById("result");
    const resultValue = document.getElementById("resultValue");
    const resultInfo = document.getElementById("resultInfo");

    resultBox.style.display = "none";

    try{

        const h1 = getValue("h1");
        const m1 = getValue("m1");
        const s1 = getValue("s1");

        const h2 = getValue("h2");
        const m2 = getValue("m2");
        const s2 = getValue("s2");

        validateTime(m1,s1);
        validateTime(m2,s2);

        const time1 =
            h1 * 3600 +
            m1 * 60 +
            s1;

        const time2 =
            h2 * 3600 +
            m2 * 60 +
            s2;

        const operation =
            document.getElementById("operation").value;

        let result;

        if(operation === "add"){
            result = time1 + time2;
        }else{
            result = time1 - time2;
        }

        resultValue.textContent = formatTime(result);

        const totalSeconds = Math.abs(result);

        resultInfo.innerHTML =
            "Total Seconds: <b>" +
            totalSeconds.toLocaleString("en-IN") +
            "</b><br>" +
            "Operation: <b>" +
            (operation === "add" ? "Addition" : "Subtraction") +
            "</b>";

        resultBox.style.display = "block";

    }catch(error){

        alert(error.message);

    }
}


function copyResult(){

    const value =
        document.getElementById("resultValue").textContent;

    if(!value) return;

    navigator.clipboard.writeText(value)
        .then(function(){
            alert("Result copied!");
        })
        .catch(function(){
            alert("Copy failed. Please copy manually.");
        });

}


function clearAll(){

    document.querySelectorAll("input").forEach(function(input){
        input.value = "";
    });

    document.getElementById("result").style.display = "none";

    document.getElementById("resultValue").textContent = "";

    document.getElementById("resultInfo").innerHTML = "";

}

</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
