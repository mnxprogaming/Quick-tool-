<body>

<div class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</div>

<div class="container">
    <div class="box">

        <div class="title">
            <div class="title-icon">📅</div>
            <h1>Date Difference Calculator</h1>
            <p>Calculate the exact difference between two dates.</p>
        </div>

        <div class="input-group">
            <label>Start Date</label>
            <input type="date" id="startDate">
        </div>

        <div class="input-group">
            <label>End Date</label>
            <input type="date" id="endDate">
        </div>

        <button class="action-btn" onclick="calculateDifference()">
             Calculate Difference
        </button>

        <button class="secondary-btn" onclick="setToday()">
            Today as End Date
        </button>

        <div class="error" id="error"></div>

        <div class="result" id="result">

            <h2>Date Difference</h2>

            <div class="big-result" id="mainResult">
                --
            </div>

            <div class="result-info" id="resultInfo"></div>

        </div>

        <div class="note">
            The calculation includes the exact number of years, months,
            days and total days between the selected dates.
        </div>

    </div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

function goHome(){
    window.location.href="tool.html";
}

function formatDate(date){

    const y=date.getFullYear();
    const m=String(date.getMonth()+1).padStart(2,"0");
    const d=String(date.getDate()).padStart(2,"0");

    return y+"-"+m+"-"+d;
}

function parseDate(value){

    const parts=value.split("-");

    if(parts.length!==3){
        return null;
    }

    return new Date(
        Number(parts[0]),
        Number(parts[1])-1,
        Number(parts[2])
    );
}

function setToday(){

    const today=new Date();

    document.getElementById("endDate").value=
        formatDate(today);
}

function calculateDifference(){

    const startValue=
        document.getElementById("startDate").value;

    const endValue=
        document.getElementById("endDate").value;

    const error=document.getElementById("error");
    const result=document.getElementById("result");

    error.style.display="none";
    result.style.display="none";

    if(!startValue || !endValue){

        error.textContent=
            "Please select both dates.";

        error.style.display="block";
        return;
    }

    let start=parseDate(startValue);
    let end=parseDate(endValue);

    if(!start || !end){

        error.textContent=
            "Please enter valid dates.";

        error.style.display="block";
        return;
    }

    if(start>end){

        const temp=start;
        start=end;
        end=temp;
    }

    let years=end.getFullYear()-start.getFullYear();
    let months=end.getMonth()-start.getMonth();
    let days=end.getDate()-start.getDate();

    if(days<0){

        months--;

        const previousMonth=
            new Date(
                end.getFullYear(),
                end.getMonth(),
                0
            );

        days+=previousMonth.getDate();
    }

    if(months<0){

        years--;
        months+=12;
    }

    const millisecondsPerDay=
        24*60*60*1000;

    const totalDays=Math.round(
        (end-start)/millisecondsPerDay
    );

    const weeks=Math.floor(totalDays/7);
    const remainingDays=totalDays%7;

    document.getElementById("mainResult").textContent=
        years+" Years, "+
        months+" Months, "+
        days+" Days";

    document.getElementById("resultInfo").innerHTML=
        "<b>Total Days:</b> "+
        totalDays.toLocaleString("en-IN")+
        "<br>"+
        "<b>Total Weeks:</b> "+
        weeks.toLocaleString("en-IN")+
        " weeks "+remainingDays+" days";

    result.style.display="block";
}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>

</script>
