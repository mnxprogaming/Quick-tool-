<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;

    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header-inner{

    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
}

.upload{
    display:block;
    text-align:center;
    border:2px dashed #6c5ce7;
    border-radius:10px;
    padding:35px 15px;
    background:#faf9ff;
    cursor:pointer;
}

.upload:hover{
    background:#f1efff;
}

.upload-icon{
    font-size:45px;
    margin-bottom:10px;
}

.upload strong{
    display:block;
    font-size:17px;
    margin-bottom:7px;
}

.upload small{
    color:#888;
    font-size:12px;
}

#file{
    display:none;
}

.info{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:10px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    line-height:1.7;
}

.text-box{
    display:none;
    margin-top:20px;
}

.text-box textarea{
    width:100%;
    min-height:300px;
    padding:15px;
    border:2px solid #e4e1f5;
    border-radius:10px;
    outline:none;
    resize:vertical;
    font-size:14px;
    line-height:1.6;
    color:#172033;
    background:white;
}

.text-box textarea:focus{
    border-color:#6c5ce7;
}

.action-btn{
    display:none;
    width:100%;
    border:none;
    margin-top:15px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.dark{
    background:#101321;
    color:white;
}

.dark .box{
    background:#191d2d;
}

.dark .title p{
    color:#aaa;
}

.dark .upload{
    background:#15192a;
    border-color:#8075ef;
}

.dark .upload small{
    color:#aaa;
}

.dark .info{
    background:#242039;
}

.dark .text-box textarea{
    background:#202438;
    border-color:#343852;
    color:white;
}

@media(max-width:500px){

    .header{

    .box{

    }

    .title h1{

/* ============================= */

        width:100%;

</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">
           ⚡ Quick Tool
        </div>

    </div>

</div>

<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">
            📝
        </div>

        <h1>PDF to Text</h1>

        <p>
            Extract text from your PDF and download it as a TXT file.
        </p>

    </div>

    <label class="upload" for="file">

        <div class="upload-icon">
            📄
        </div>

        <strong>
            Select PDF File
        </strong>

        <small>
            Choose a PDF to extract text
        </small>

    </label>

    <input
        type="file"
        id="file"
        accept="application/pdf"
    >

    <div class="info" id="info"></div>

    <div class="text-box" id="textBox">

        <textarea
            id="outputText"
            placeholder="Extracted text will appear here..."
        ></textarea>

    </div>

    <button
        class="action-btn"
        id="downloadBtn"
        onclick="downloadText()"
    >
        ⬇ Download TXT
    </button>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const fileInput = document.getElementById("file");
const info = document.getElementById("info");
const textBox = document.getElementById("textBox");
const outputText = document.getElementById("outputText");
const downloadBtn = document.getElementById("downloadBtn");

let extractedText = "";
let originalFileName = "quicktool";


fileInput.addEventListener("change", async function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    if(file.type !== "application/pdf"){

        alert("Please select a PDF file.");

        this.value = "";

        return;
    }

    originalFileName = file.name
        .replace(/\.pdf$/i,"");

    info.style.display = "block";

    info.innerHTML =
        "⏳ Reading PDF...";

    textBox.style.display = "none";

    downloadBtn.style.display = "none";

    extractedText = "";

    try{

        const arrayBuffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: arrayBuffer
        }).promise;

        let allText = "";

        for(let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++){

            info.innerHTML =
                "⏳ Extracting page <b>" +
                pageNumber +
                "</b> of <b>" +
                pdf.numPages +
                "</b>...";

            const page = await pdf.getPage(pageNumber);

            const textContent =
                await page.getTextContent();

            const pageText =
                textContent.items
                    .map(item => item.str)
                    .join(" ");

            allText +=
                "\n\n--- Page " +
                pageNumber +
                " ---\n\n" +
                pageText;
        }

        extractedText = allText.trim();

        if(!extractedText){

            info.innerHTML =
                "⚠️ No selectable text found in this PDF.";

            textBox.style.display = "none";

            downloadBtn.style.display = "none";

            return;
        }

        info.innerHTML =
            "✅ Text extracted successfully<br>" +
            "📑 Pages: <b>" +
            pdf.numPages +
            "</b><br>" +
            "📝 Characters: <b>" +
            extractedText.length.toLocaleString() +
            "</b>";

        outputText.value = extractedText;

        textBox.style.display = "block";

        downloadBtn.style.display = "block";

    }catch(error){

        console.error(error);

        info.innerHTML =
            "❌ Unable to read this PDF.";

        alert(
            "PDF text extraction failed. Please try another PDF."
        );

    }

    this.value = "";

});


function downloadText(){

    if(!extractedText){

        alert("No text available to download.");

        return;
    }

    const text = outputText.value;

    const blob = new Blob(
        [text],
        {type:"text/plain;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;

    link.download =
        originalFileName + "-text.txt";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);

}


function goHome(){

    window.location.href = "tool.html";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
