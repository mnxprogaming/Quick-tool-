<body>

<header class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        </div>

</header>


<main class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">
            📄
        </div>

        <h1>Image to PDF</h1>

        <p>
            Convert your image into a PDF file quickly and easily.
        </p>

    </div>


    <label class="upload" for="file">

        <div class="upload-icon">
            🖼️
        </div>

        <strong>
            Choose Image
        </strong>

        <small>
            JPG, JPEG or PNG • Max recommended 10MB
        </small>

    </label>

    <input
        type="file"
        id="file"
        accept="image/jpeg,image/png,image/webp"
    >


    <div class="preview" id="preview">

        <div class="preview-title">
            Image Preview
        </div>

        <img id="previewImg" alt="Preview">

    </div>


    <div class="info" id="info"></div>


    <div class="settings" id="settings">

        <label>
            PDF Quality:
            <span id="qualityValue">85%</span>
        </label>

        <input
            type="range"
            id="pdfQuality"
            min="40"
            max="100"
            value="85"
        >

        <div class="quality-value">
            Higher quality = better image quality and larger PDF
        </div>

    </div>


    <button
        class="compress-btn"
        id="convertBtn"
        onclick="createPDF()"
    >
         Convert to PDF
    </button>


    <div class="result" id="result">

        <h2>
            ✅ PDF Created Successfully
        </h2>

        <div
            class="result-info"
            id="resultInfo">
        </div>

        <a
            id="download"
            class="download"
            download="quicktool-image.pdf">
            ⬇️ Download PDF
        </a>

    </div>
   </div>
<div id="toolSuggestions" class="tool-suggestions"></div>

<script>

let selectedFile = null;


/* FILE SELECT */

document.getElementById("file").addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }


    if(file.size > 10 * 1024 * 1024){

        alert("Please choose an image smaller than 10MB.");

        this.value = "";

        return;
    }


    selectedFile = file;


    const url =
        URL.createObjectURL(file);


    const img =
        new Image();


    img.onload = function(){

        document.getElementById("previewImg").src =
            url;

        document.getElementById("preview").style.display =
            "block";


        document.getElementById("info").innerHTML =

            "📄 File: <b>" +
            file.name +
            "</b><br>" +

            "📦 Image Size: <b>" +
            formatSize(file.size) +
            "</b><br>" +

            "📐 Dimensions: <b>" +
            img.width +
            " × " +
            img.height +
            " px</b>";


        document.getElementById("info").style.display =
            "block";


        document.getElementById("settings").style.display =
            "block";


        document.getElementById("convertBtn").style.display =
            "block";


        document.getElementById("result").style.display =
            "none";

    };


    img.src = url;

});


/* QUALITY */

document.getElementById("pdfQuality").addEventListener("input",function(){

    document.getElementById("qualityValue").innerText =
        this.value + "%";

});


/* CREATE PDF */

function createPDF(){

    if(!selectedFile){

        alert("Please select an image first.");

        return;
    }


    const img =
        new Image();


    const url =
        URL.createObjectURL(selectedFile);


    img.onload = function(){

        const quality =
            parseInt(
                document.getElementById("pdfQuality").value
            ) / 100;


        /*
        PDF page size:
        A4 = 595 × 842 points
        */

        const pageWidth = 595;
        const pageHeight = 842;


        const margin = 25;


        const maxWidth =
            pageWidth - margin * 2;

        const maxHeight =
            pageHeight - margin * 2;


        let width =
            img.width;

        let height =
            img.height;


        const ratio =
            Math.min(
                maxWidth / width,
                maxHeight / height
            );


        width =
            width * ratio;

        height =
            height * ratio;


        /*
        Create canvas for PDF page
        */

        const canvas =
            document.createElement("canvas");


        canvas.width =
            Math.round(width);

        canvas.height =
            Math.round(height);


        const ctx =
            canvas.getContext("2d");


        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
        Generate JPEG data
        */

        const imageData =
            canvas.toDataURL(
                "image/jpeg",
                quality
            );


        /*
        Build a simple PDF
        */

        const pdf =
            buildPDF(
                imageData,
                canvas.width,
                canvas.height
            );


        const blob =
            new Blob(
                [pdf],
                {type:"application/pdf"}
            );


        const downloadUrl =
            URL.createObjectURL(blob);


        document.getElementById("download").href =
            downloadUrl;


        document.getElementById("download").download =
            "quicktool-image.pdf";


        document.getElementById("resultInfo").innerHTML =

            "Original Image Size: <b>" +
            formatSize(selectedFile.size) +
            "</b><br>" +

            "PDF Size: <b>" +
            formatSize(blob.size) +
            "</b><br>" +

            "PDF Page: <b>A4</b>";


        document.getElementById("result").style.display =
            "block";


        document.getElementById("result").scrollIntoView({

            behavior:"smooth"

        });

    };


    img.src = url;

}


/* SIMPLE PDF GENERATOR - byte-accurate build (FIXED) */
/*
   The old version concatenated the raw JPEG binary string
   directly into the PDF text string and then ran the WHOLE
   thing through TextEncoder (UTF-8). Any binary byte above
   127 got re-encoded into multiple UTF-8 bytes, corrupting
   the image stream AND shifting every xref offset that came
   after it - which is exactly why the PDF opened blank.

   Fix: build the PDF as a list of Uint8Array "chunks"
   (text chunks encoded with TextEncoder, binary chunks left
   untouched) and track the running length in actual BYTES,
   not string characters. Offsets used in xref are then
   guaranteed correct.
*/

function buildPDF(imageData, width, height){

    const base64 =
        imageData.split(",")[1];

    const binary =
        atob(base64);

    const imageBytes =
        new Uint8Array(binary.length);

    for(let i = 0; i < binary.length; i++){
        imageBytes[i] = binary.charCodeAt(i);
    }

    const encoder = new TextEncoder();
    const chunks = [];
    let length = 0;

    function pushText(str){
        const bytes = encoder.encode(str);
        chunks.push(bytes);
        length += bytes.length;
    }

    function pushBytes(bytes){
        chunks.push(bytes);
        length += bytes.length;
    }

    const offsets = [0]; // offsets[0] unused (object 0 is free)

    pushText("%PDF-1.4\n");

    // Object 1: Catalog
    offsets.push(length);
    pushText(
        "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n"
    );

    // Object 2: Pages
    offsets.push(length);
    pushText(
        "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n"
    );

    // Object 3: Page
    offsets.push(length);
    pushText(
        "3 0 obj\n<< /Type /Page /Parent 2 0 R " +
        "/MediaBox [0 0 595 842] " +
        "/Resources << /XObject << /Im1 5 0 R >> >> " +
        "/Contents 4 0 R >>\nendobj\n"
    );

    // Scale image to fit page with margins, centered
    const scale =
        Math.min(545 / width, 792 / height);

    const drawWidth = width * scale;
    const drawHeight = height * scale;

    const x = (595 - drawWidth) / 2;
    const y = (842 - drawHeight) / 2;

    const content =
        "q\n" +
        drawWidth + " 0 0 " + drawHeight + " " +
        x + " " + y + " cm\n" +
        "/Im1 Do\nQ";

    const contentBytes = encoder.encode(content);

    // Object 4: Content stream
    offsets.push(length);
    pushText(
        "4 0 obj\n<< /Length " + contentBytes.length + " >>\nstream\n"
    );
    pushBytes(contentBytes);
    pushText("\nendstream\nendobj\n");

    // Object 5: Image XObject (binary JPEG stream, untouched)
    offsets.push(length);
    pushText(
        "5 0 obj\n<< /Type /XObject /Subtype /Image " +
        "/Width " + width + " /Height " + height + " " +
        "/ColorSpace /DeviceRGB /BitsPerComponent 8 " +
        "/Filter /DCTDecode /Length " + imageBytes.length +
        " >>\nstream\n"
    );
    pushBytes(imageBytes);
    pushText("\nendstream\nendobj\n");

    // xref table
    const xrefOffset = length;

    let xref =
        "xref\n0 6\n0000000000 65535 f \n";

    for(let i = 1; i <= 5; i++){
        xref +=
            String(offsets[i]).padStart(10, "0") +
            " 00000 n \n";
    }

    pushText(xref);

    pushText(
        "trailer\n<< /Size 6 /Root 1 0 R >>\n" +
        "startxref\n" + xrefOffset + "\n%%EOF"
    );

    // Merge all chunks into one final Uint8Array
    const result = new Uint8Array(length);
    let pos = 0;

    for(const c of chunks){
        result.set(c, pos);
        pos += c.length;
    }

    return result;
}


/* FILE SIZE */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(2) + " MB";

}


/* HOME */

function goHome(){

    window.location.href =
        "tool.html";

}


/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}

</script>
