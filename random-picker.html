<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Picker - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.input-area{
    margin-top:20px;
}

.input-area label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:2px solid #e2defd;
    border-radius:10px;
    padding:15px;
    font-size:15px;
    font-family:Arial,sans-serif;
    outline:none;
}

textarea:focus{
    border-color:#6c5ce7;
}

.pick-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin:0 0 10px;
}

.result-value{
    font-size:25px;
    font-weight:800;
    word-break:break-word;
}

.info{
    margin-top:18px;
    padding:15px;
    border-radius:17px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
}

.dark{
    background:#101321;
    color:white;
}

.dark .box{
    background:#191d2d;
}

.dark .title p{
    color:#aaa;
}

.dark textarea{
    background:#15192a;
    color:white;
    border-color:#8075ef;
}

.dark .info{
    background:#242039;
}

.dark .result{
    background:#102b25;
}

.dark .result-value{
    color:white;
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">
    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">⚡ Quick Tool</div>

    </div>
</div>


<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🎲</div>

        <h1>Random Picker</h1>

        <p>
            Enter multiple items and randomly pick one.
        </p>

    </div>


    <div class="input-area">

        <label>Enter Items</label>

        <textarea
            id="items"
            placeholder="Enter one item per line&#10;&#10;Example:&#10;Rahul&#10;Amit&#10;Neeraj&#10;Rohit">
        </textarea>

    </div>


    <button class="pick-btn" onclick="pickRandom()">
        🎲 Pick Random
    </button>


    <div class="result" id="result">

        <h2>🎉 Selected Item</h2>

        <div class="result-value" id="resultValue">
            -
        </div>

    </div>


    <div class="info">

        💡 Enter one item per line for the best result.

    </div>

</div>

<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>



<script>

function pickRandom(){

    const text = document.getElementById("items").value;

    const items = text
        .split("\n")
        .map(item => item.trim())
        .filter(item => item.length > 0);

    if(items.length === 0){

        alert("Please enter at least one item.");

        return;
    }

    const randomIndex =
        Math.floor(Math.random() * items.length);

    const selected = items[randomIndex];

    document.getElementById("resultValue").textContent =
        selected;

    document.getElementById("result").style.display =
        "block";
}


function goHome(){

    window.location.href = "tool.html";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
