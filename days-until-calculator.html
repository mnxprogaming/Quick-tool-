    background:#f4f6ff;
    color:#172033;

    padding-bottom:30px;

    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.input-group{
    margin-top:18px;
}

.input-group label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
    background:white;
    color:#172033;
}

.input-group input:focus{
    border-color:#6c5ce7;
}

.action-btn{
    width:100%;
    border:0;
    margin-top:20px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.secondary{
    width:100%;
    border:0;
    margin-top:12px;
    padding:14px;
    border-radius:15px;
    background:#eeeaff;
    color:#5547c7;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin:0 0 10px;
}

.result-value{
    font-size:32px;
    font-weight:800;
    word-break:break-word;
    margin:12px 0;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
}

.copy{
    display:inline-block;
    margin-top:15px;
    padding:14px 25px;
    border-radius:15px;
    background:#00b894;
    color:white;
    border:0;
    font-weight:bold;
    cursor:pointer;
}

.info{
    margin-top:20px;
    padding:15px;
    border-radius:17px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    line-height:1.6;
}

.dark{
    background:#101321;
    color:white;
}

.dark .box{
    background:#191d2d;
}

.dark .title p{
    color:#aaa;
}

.dark .input-group input{
    background:#15192a;
    color:white;
    border-color:#33384d;
}

.dark .secondary{
    background:#242039;
    color:#aaa5ff;
}

.dark .info{
    background:#242039;
}

.dark .result{
    background:#102b25;
}

.dark .result-info{

    /* Common tool content */

    .input-group,

    .tool-area,

</style>

<body>

<div class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</div>

<div class="container">
    <div class="box">

        <div class="title">
            <div class="title-icon">⏳</div>

            <h1>Days Until Calculator</h1>

            <p>
                Find exactly how many days are left until any date.
            </p>
        </div>

        <div class="input-group">
            <label for="targetDate">Target Date</label>

            <input type="date" id="targetDate">
        </div>

        <button class="action-btn" onclick="calculateDays()">
            Calculate Days
        </button>

        <button class="secondary" onclick="setToday()">
            Set Today
        </button>

        <button class="secondary" onclick="clearAll()">
            Clear
        </button>

        <div class="result" id="result">

            <h2 id="resultTitle">Result</h2>

            <div class="result-value" id="resultValue"></div>

            <div class="result-info" id="resultInfo"></div>

            <button class="copy" onclick="copyResult()">
                Copy Result
            </button>

        </div>

        <div class="info">
            <strong>Tip:</strong><br>
            Select any future date to see the remaining days.
            Past dates will also show how many days have passed.
        </div>

    </div>
    <div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>



<script>

function goHome(){
    window.location.href="tool.html";
}


function localDateFromInput(value){

    const parts = value.split("-");

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );
}


function startOfDay(date){

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

}


function formatDate(date){

    return date.toLocaleDateString("en-IN",{
        day:"2-digit",
        month:"long",
        year:"numeric"
    });

}


function setToday(){

    const today = new Date();

    const year = today.getFullYear();

    const month = String(
        today.getMonth() + 1
    ).padStart(2,"0");

    const day = String(
        today.getDate()
    ).padStart(2,"0");

    document.getElementById("targetDate").value =
        year + "-" + month + "-" + day;

}


function calculateDays(){

    const input =
        document.getElementById("targetDate").value;

    const resultBox =
        document.getElementById("result");

    const resultTitle =
        document.getElementById("resultTitle");

    const resultValue =
        document.getElementById("resultValue");

    const resultInfo =
        document.getElementById("resultInfo");

    resultBox.style.display = "none";

    if(!input){
        alert("Please select a target date.");
        return;
    }

    const target = localDateFromInput(input);

    const today = startOfDay(new Date());

    const difference =
        target.getTime() - today.getTime();

    const millisecondsPerDay =
        1000 * 60 * 60 * 24;

    const days =
        Math.round(
            difference / millisecondsPerDay
        );

    const absoluteDays = Math.abs(days);

    if(days > 0){

        resultTitle.textContent =
            "Days Remaining";

        resultValue.textContent =
            absoluteDays.toLocaleString("en-IN") +
            " Days";

        resultInfo.innerHTML =
            "Target Date: <b>" +
            formatDate(target) +
            "</b><br>" +
            "Status: <b>Upcoming</b>";

    }

    else if(days < 0){

        resultTitle.textContent =
            "Days Passed";

        resultValue.textContent =
            absoluteDays.toLocaleString("en-IN") +
            " Days Ago";

        resultInfo.innerHTML =
            "Target Date: <b>" +
            formatDate(target) +
            "</b><br>" +
            "Status: <b>Past</b>";

    }

    else{

        resultTitle.textContent =
            "Today";

        resultValue.textContent =
            "0 Days";

        resultInfo.innerHTML =
            "Target Date: <b>" +
            formatDate(target) +
            "</b><br>" +
            "The selected date is today.";

    }

    resultBox.style.display = "block";

}


function copyResult(){

    const value =
        document.getElementById("resultValue").textContent;

    if(!value) return;

    navigator.clipboard.writeText(value)
        .then(function(){
            alert("Result copied!");
        })
        .catch(function(){
            alert("Copy failed. Please copy manually.");
        });

}


function clearAll(){

    document.getElementById("targetDate").value = "";

    document.getElementById("result").style.display = "none";

    document.getElementById("resultValue").textContent = "";

    document.getElementById("resultInfo").innerHTML = "";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
