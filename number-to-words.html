<body>

<div class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</div>

<div class="container">
    <div class="box">

        <div class="title">
            <div class="title-icon">🔢</div>
            <h1>Number to Words</h1>
            <p>Convert numbers into words instantly.</p>
        </div>

        <div class="input-group">
            <label>Enter Number</label>
            <input
                type="text"
                id="numberInput"
                placeholder="Example: 125000"
                inputmode="decimal">
        </div>

        <div class="input-group">
            <label>Number System</label>
            <select id="system">
                <option value="indian" selected>Indian (Lakh / Crore)</option>
                <option value="international">International (Million / Billion)</option>
            </select>
        </div>

        <button class="action-btn" onclick="convertNumber()">
            🔢 Convert to Words
        </button>

        <button class="secondary-btn" onclick="clearAll()">
            Clear
        </button>

        <div class="error" id="error"></div>

        <div class="result" id="result">

            <h2>Result</h2>

            <div class="result-text" id="resultText"></div>

            <button class="copy-btn" onclick="copyResult()">
                📋 Copy Result
            </button>

        </div>

        <div class="note">
            Supports large whole numbers and decimal values.
            Indian format uses Lakh and Crore.
        </div>

    </div>
    <div
        id="toolSuggestions"
        class="tool-suggestions"
    ></div>
    <div id="introSection"></div>
    <footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>
</div>

<script>

function goHome(){
    window.location.href="tool.html";
}

const ones=[
    "",
    "One",
    "Two",
    "Three",
    "Four",
    "Five",
    "Six",
    "Seven",
    "Eight",
    "Nine",
    "Ten",
    "Eleven",
    "Twelve",
    "Thirteen",
    "Fourteen",
    "Fifteen",
    "Sixteen",
    "Seventeen",
    "Eighteen",
    "Nineteen"
];

const tens=[
    "",
    "",
    "Twenty",
    "Thirty",
    "Forty",
    "Fifty",
    "Sixty",
    "Seventy",
    "Eighty",
    "Ninety"
];

function belowThousand(n){

    let words="";

    if(n>=100){

        words+=ones[Math.floor(n/100)]+" Hundred";
        n%=100;

        if(n>0){
            words+=" ";
        }
    }

    if(n>=20){

        words+=tens[Math.floor(n/10)];
        n%=10;

        if(n>0){
            words+=" "+ones[n];
        }

    }else if(n>0){

        words+=ones[n];
    }

    return words;
}

function indianIntegerToWords(str){

    str=str.replace(/^0+/,"");

    if(str===""){
        return "Zero";
    }

    let groups=[];

    let last3=str.slice(-3);

    if(last3){
        groups.unshift(Number(last3));
    }

    let remaining=str.slice(0,-3);

    while(remaining.length>0){

        let group=remaining.slice(-2);

        remaining=remaining.slice(0,-2);

        groups.unshift(Number(group));
    }

    const names=[
        "",
        "Thousand",
        "Lakh",
        "Crore",
        "Arab",
        "Kharab",
        "Neel",
        "Padma",
        "Shankh"
    ];

    let words=[];

    let startIndex=groups.length-1;

    for(let i=0;i<groups.length;i++){

        const value=groups[i];

        if(value===0){
            continue;
        }

        const nameIndex=startIndex-i;

        let part=belowThousand(value);

        if(names[nameIndex]){
            part+=" "+names[nameIndex];
        }

        words.push(part);
    }

    return words.join(" ");
}

function internationalIntegerToWords(str){

    str=str.replace(/^0+/,"");

    if(str===""){
        return "Zero";
    }

    const groups=[];

    while(str.length>0){

        groups.unshift(
            Number(str.slice(-3))
        );

        str=str.slice(0,-3);
    }

    const names=[
        "",
        "Thousand",
        "Million",
        "Billion",
        "Trillion",
        "Quadrillion",
        "Quintillion",
        "Sextillion",
        "Septillion",
        "Octillion",
        "Nonillion",
        "Decillion"
    ];

    let words=[];

    const startIndex=groups.length-1;

    for(let i=0;i<groups.length;i++){

        const value=groups[i];

        if(value===0){
            continue;
        }

        const nameIndex=startIndex-i;

        let part=belowThousand(value);

        if(names[nameIndex]){
            part+=" "+names[nameIndex];
        }

        words.push(part);
    }

    return words.join(" ");
}

function decimalWords(decimal){

    if(!decimal){
        return "";
    }

    const digits=decimal.split("");

    const words=digits.map(
        d=>ones[Number(d)]
    );

    return words.join(" ");
}

function convertNumber(){

    const input=
        document.getElementById("numberInput").value.trim();

    const system=
        document.getElementById("system").value;

    const error=
        document.getElementById("error");

    const result=
        document.getElementById("result");

    const resultText=
        document.getElementById("resultText");

    error.style.display="none";
    result.style.display="none";

    if(!input){

        error.textContent="Please enter a number.";
        error.style.display="block";
        return;
    }

    if(!/^[+-]?\d+(?:\.\d+)?$/.test(input)){

        error.textContent=
            "Please enter a valid number.";

        error.style.display="block";
        return;
    }

    let value=input;

    let negative=false;

    if(value.startsWith("-")){

        negative=true;
        value=value.slice(1);

    }else if(value.startsWith("+")){

        value=value.slice(1);
    }

    const parts=value.split(".");

    let integerPart=parts[0];
    const decimalPart=parts[1] || "";

    integerPart=integerPart.replace(/^0+/,"");

    if(integerPart===""){
        integerPart="0";
    }

    let words;

    if(system==="indian"){

        words=indianIntegerToWords(integerPart);

    }else{

        words=internationalIntegerToWords(integerPart);
    }

    if(negative){
        words="Minus "+words;
    }

    if(decimalPart){

        words+=" Point "+decimalWords(decimalPart);
    }

    resultText.textContent=words;

    result.style.display="block";
}

async function copyResult(){

    const text=
        document.getElementById("resultText").textContent;

    try{

        await navigator.clipboard.writeText(text);

        alert("Result copied!");

    }catch(e){

        alert("Copy failed. Please copy manually.");
    }
}

function clearAll(){

    document.getElementById("numberInput").value="";
    document.getElementById("result").style.display="none";
    document.getElementById("error").style.display="none";
}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
