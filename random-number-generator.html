<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Number Generator - Quick Tool</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.settings{
    margin-top:20px;
}

.settings label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #e2e2ed;
    border-radius:15px;
    font-size:16px;
    outline:none;
    margin-bottom:16px;
}

input:focus{
    border-color:#6c5ce7;
}

.generate-btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
    display:none;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin:0 0 10px;
}

.number{
    font-size:42px;
    font-weight:800;
    margin:10px 0 15px;
    word-break:break-word;
}

.copy-btn{
    border:none;
    padding:13px 22px;
    border-radius:15px;
    background:#00b894;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
    margin-top:12px;
}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark input{
    background:#15192a;
    color:white;
    border-color:#444;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-info{
    color:#ccc;
}

@media(max-width:500px){
    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .number{
        font-size:34px;
    }
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">
    <div class="header-inner">
        <button class="back" onclick="goHome()">‹</button>
        <div class="logo">⚡ Quick Tool</div>
    </div>
</div>

<div class="container">
<div class="box">

    <div class="title">
        <div class="title-icon">🎲</div>

        <h1>Random Number Generator</h1>

        <p>Generate a random number between any minimum and maximum value.</p>
    </div>

    <div class="settings">

        <label for="min">Minimum Number</label>
        <input type="number" id="min" value="1">

        <label for="max">Maximum Number</label>
        <input type="number" id="max" value="100">

        <button class="generate-btn" onclick="generateNumber()">
            🎲 Generate Random Number
        </button>

    </div>

    <div class="result" id="result">

        <h2>Random Number</h2>

        <div class="number" id="number">0</div>

        <button class="copy-btn" onclick="copyNumber()">
            📋 Copy Number
        </button>

        <div class="result-info" id="resultInfo"></div>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

function goHome(){
    window.location.href="tool.html";
}

function generateNumber(){

    const min=Number(document.getElementById("min").value);
    const max=Number(document.getElementById("max").value);

    if(!Number.isFinite(min) || !Number.isFinite(max)){
        alert("Please enter both numbers.");
        return;
    }

    if(min>max){
        alert("Minimum number cannot be greater than maximum number.");
        return;
    }

    if(!Number.isInteger(min) || !Number.isInteger(max)){
        alert("Please enter whole numbers.");
        return;
    }

    const random=
        Math.floor(Math.random()*(max-min+1))+min;

    document.getElementById("number").textContent=random;

    document.getElementById("resultInfo").innerHTML=
        "Range: "+min+" to "+max+
        "<br>New random number generated.";

    document.getElementById("result").style.display="block";
}

async function copyNumber(){

    const number=document.getElementById("number").textContent;

    try{

        await navigator.clipboard.writeText(number);

        alert("Number copied!");

    }catch(error){

        const temp=document.createElement("textarea");

        temp.value=number;
        document.body.appendChild(temp);

        temp.select();
        document.execCommand("copy");

        temp.remove();

        alert("Number copied!");
    }
}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
