<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Age Calculator - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:9px;
}

.field input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
}

.field input:focus{
    border-color:#6c5ce7;
}

.calculate-btn{
    width:100%;
    border:none;
    margin-top:5px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin-bottom:18px;
}

.age-main{
    font-size:25px;
    font-weight:bold;
    color:#6c5ce7;
    margin-bottom:18px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.result-item{
    background:white;
    border-radius:15px;
    padding:15px 8px;
}

.result-item strong{
    display:block;
    color:#6c5ce7;
    font-size:20px;
    margin-bottom:6px;
}

.result-item span{
    color:#777;
    font-size:12px;
}

.next-birthday{
    margin-top:15px;
    padding:14px;
    background:white;
    border-radius:15px;
    font-size:14px;
    line-height:1.6;
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }
}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .field input{
    background:#15192a;
    color:white;
    border-color:#444;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-item,
body.dark .next-birthday{
    background:#191d2d;
}

body.dark .result-item span{
    color:#aaa;
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<header class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">⚡ Quick Tool</div>

    </div>

</header>

<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🎂</div>

        <h1>Age Calculator</h1>

        <p>Calculate your exact age in years, months and days.</p>

    </div>

    <div class="field">

        <label for="birthDate">Date of Birth</label>

        <input
            type="date"
            id="birthDate"
        >

    </div>

    <button
        class="calculate-btn"
        onclick="calculateAge()"
    >
        Calculate Age
    </button>

    <div class="result" id="result">

        <h2>Your Age</h2>

        <div class="age-main" id="ageMain">
            0 Years 0 Months 0 Days
        </div>

        <div class="result-grid">

            <div class="result-item">

                <strong id="years">0</strong>

                <span>Years</span>

            </div>

            <div class="result-item">

                <strong id="months">0</strong>

                <span>Months</span>

            </div>

            <div class="result-item">

                <strong id="days">0</strong>

                <span>Days</span>

            </div>

        </div>

        <div class="next-birthday" id="birthday">
        </div>
</div>
    </div>

<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>
<script>

function goHome(){

    window.location.href="tool.html";

}


function calculateAge(){

    const input =
        document.getElementById("birthDate").value;

    if(!input){

        alert("Please select your date of birth.");

        return;

    }


    const birth =
        new Date(input + "T00:00:00");

    const today =
        new Date();


    if(birth > today){

        alert("Date of birth cannot be in the future.");

        return;

    }


    let years =
        today.getFullYear() -
        birth.getFullYear();

    let months =
        today.getMonth() -
        birth.getMonth();

    let days =
        today.getDate() -
        birth.getDate();


    if(days < 0){

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();

    }


    if(months < 0){

        years--;

        months += 12;

    }


    document.getElementById("years").innerText =
        years;

    document.getElementById("months").innerText =
        months;

    document.getElementById("days").innerText =
        days;


    document.getElementById("ageMain").innerText =
        years + " Years " +
        months + " Months " +
        days + " Days";


    /* NEXT BIRTHDAY */

    let nextBirthday =
        new Date(
            today.getFullYear(),
            birth.getMonth(),
            birth.getDate()
        );


    if(nextBirthday < today){

        nextBirthday =
            new Date(
                today.getFullYear() + 1,
                birth.getMonth(),
                birth.getDate()
            );

    }


    const difference =
        nextBirthday - today;

    const daysLeft =
        Math.ceil(
            difference /
            (1000 * 60 * 60 * 24)
        );


    document.getElementById("birthday").innerText =
        "🎉 Next Birthday: " +
        daysLeft +
        " days left";


    document.getElementById("result").style.display =
        "block";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
