<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>URL Encoder Decoder - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.editor{
    margin-top:20px;
}

.editor label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

textarea{
    width:100%;
    min-height:210px;
    resize:vertical;
    padding:15px;
    border:2px solid #e2defd;
    border-radius:10px;
    outline:none;
    font-family:monospace;
    font-size:14px;
    line-height:1.5;
}

textarea:focus{
    border-color:#6c5ce7;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.action-btn{
    flex:1;
    border:0;
    padding:15px;
    border-radius:16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.encode{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
}

.decode{
    background:#eeeaff;
    color:#6c5ce7;
}

.clear{
    background:#f1f1f5;
    color:#555;
}

.copy{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:15px;
    background:#00b894;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:17px;
    background:#eafff7;
    color:#008f6d;
    text-align:center;
    font-size:14px;
}

.info{
    margin-top:18px;
    padding:15px;
    border-radius:17px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    line-height:1.6;
}

.dark{
    background:#101321;
    color:white;
}

.dark .box{
    background:#191d2d;
}

.dark .title p{
    color:#aaa;
}

.dark textarea{
    background:#15192a;
    color:white;
    border-color:#8075ef;
}

.dark .decode{
    background:#242039;
    color:white;
}

.dark .clear{
    background:#303444;
    color:white;
}

.dark .info{
    background:#242039;
}

.dark .result{
    background:#102b25;
    color:#66e6c1;
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{

    }

    .title h1{

    }

    .buttons{
        flex-direction:column;
    }
}

/* DESKTOP RESPONSIVE FIX */

/* ============================= */

        height:56px;

        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;

    }

    .title h1{
        font-size:38px;
    }

    .title p{

    /* Common tool content */

    .input-group,
    .tool-content,

    .generator,
    .converter,

    }

}

    .color-square,
    .hue-slider{

    }

    }

</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">⚡ Quick Tool</div>

    </div>

</div>


<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🔗</div>

        <h1>URL Encoder & Decoder</h1>

        <p>
            Encode or decode URLs and text safely.
        </p>

    </div>


    <div class="editor">

        <label>Enter URL or Text</label>

        <textarea
            id="input"
            placeholder="Enter URL or text here..."></textarea>

    </div>


    <div class="buttons">

        <button class="action-btn encode"
                onclick="encodeURL()">
            🔒 Encode URL
        </button>

        <button class="action-btn decode"
                onclick="decodeURL()">
            🔓 Decode URL
        </button>

        <button class="action-btn clear"
                onclick="clearText()">
            Clear
        </button>

    </div>


    <button class="copy"
            onclick="copyResult()">
        📋 Copy Result
    </button>


    <div class="result"
         id="result">
    </div>


    <div class="info">

        🔒 Your data is processed only in your browser.

    </div>

</div>

<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>



<script>

function encodeURL(){

    const input =
        document.getElementById("input").value;

    if(!input){

        showResult("Please enter a URL or text.");

        return;
    }

    try{

        document.getElementById("input").value =
            encodeURIComponent(input);

        showResult("✅ URL encoded successfully.");

    }
    catch(error){

        showResult("❌ Unable to encode.");

    }

}


function decodeURL(){

    const input =
        document.getElementById("input").value;

    if(!input){

        showResult("Please enter encoded URL data.");

        return;
    }

    try{

        document.getElementById("input").value =
            decodeURIComponent(input);

        showResult("✅ URL decoded successfully.");

    }
    catch(error){

        showResult("❌ Invalid encoded URL.");

    }

}


function showResult(message){

    const result =
        document.getElementById("result");

    result.textContent = message;

    result.style.display = "block";

}


function copyResult(){

    const input =
        document.getElementById("input");

    if(!input.value){

        alert("Nothing to copy.");

        return;
    }

    navigator.clipboard.writeText(input.value)
        .then(() => {

            showResult("✅ Result copied!");

        })
        .catch(() => {

            input.select();
            document.execCommand("copy");

            showResult("✅ Result copied!");

        });

}


function clearText(){

    document.getElementById("input").value = "";

    document.getElementById("result").style.display =
        "none";

}


function goHome(){

    window.location.href = "tool.html";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>

<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
