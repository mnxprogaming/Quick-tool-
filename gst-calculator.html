<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GST Calculator - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:9px;
}

.field input,
.field select{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
    background:white;
}

.field input:focus,
.field select:focus{
    border-color:#6c5ce7;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:5px;
}

.calculate-btn{
    border:none;
    padding:16px 10px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.reset-btn{
    border:none;
    padding:16px 10px;
    border-radius:17px;
    background:#eeeaff;
    color:#6c5ce7;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
}

.result h2{
    text-align:center;
    color:#00a77d;
    font-size:20px;
    margin-bottom:18px;
}

.result-item{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.result-item span{
    color:#555;
}

.result-item strong{
    color:#6c5ce7;
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .buttons{
        grid-template-columns:1fr;
    }
}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .field input,
body.dark .field select{
    background:#15192a;
    color:white;
    border-color:#444;
}

body.dark .reset-btn{
    background:#242039;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-item{
    background:#191d2d;
}

body.dark .result-item span{
    color:#aaa;
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<header class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">⚡ Quick Tool</div>

    </div>

</header>

<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🧾</div>

        <h1>GST Calculator</h1>

        <p>Calculate GST amount, final price and original price easily.</p>

    </div>


    <div class="field">

        <label for="amount">Amount (₹)</label>

        <input
            type="number"
            id="amount"
            placeholder="Example: 1000"
            min="0"
            step="0.01"
        >

    </div>


    <div class="field">

        <label for="gst">GST Rate</label>

        <select id="gst">

            <option value="5">5%</option>

            <option value="12">12%</option>

            <option value="18" selected>18%</option>

            <option value="28">28%</option>

        </select>

    </div>


    <div class="buttons">

        <button
            class="calculate-btn"
            onclick="addGST()"
        >
            Add GST
        </button>

        <button
            class="calculate-btn"
            onclick="removeGST()"
        >
            Remove GST
        </button>

    </div>


    <button
        class="reset-btn"
        onclick="resetCalculator()"
        style="width:100%;margin-top:10px;"
    >
        Reset
    </button>


    <div class="result" id="result">

        <h2 id="resultTitle">GST Result</h2>

        <div class="result-item">

            <span>Original Amount</span>

            <strong id="original">₹0</strong>

        </div>

        <div class="result-item">

            <span>GST Amount</span>

            <strong id="gstAmount">₹0</strong>

        </div>

        <div class="result-item">

            <span>Final Amount</span>

            <strong id="finalAmount">₹0</strong>

        </div>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>

<script>

function goHome(){

    window.location.href="tool.html";

}


function money(value){

    return "₹" + value.toFixed(2).toLocaleString("en-IN");

}


function addGST(){

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const rate =
        parseFloat(
            document.getElementById("gst").value
        );


    if(!amount || amount < 0){

        alert("Please enter a valid amount.");

        return;

    }


    const gstAmount =
        amount * rate / 100;

    const finalAmount =
        amount + gstAmount;


    document.getElementById("resultTitle").innerText =
        "GST Added";

    document.getElementById("original").innerText =
        money(amount);

    document.getElementById("gstAmount").innerText =
        money(gstAmount);

    document.getElementById("finalAmount").innerText =
        money(finalAmount);

    document.getElementById("result").style.display =
        "block";

}


function removeGST(){

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const rate =
        parseFloat(
            document.getElementById("gst").value
        );


    if(!amount || amount < 0){

        alert("Please enter a valid amount.");

        return;

    }


    const originalAmount =
        amount / (1 + rate / 100);

    const gstAmount =
        amount - originalAmount;


    document.getElementById("resultTitle").innerText =
        "GST Removed";

    document.getElementById("original").innerText =
        money(originalAmount);

    document.getElementById("gstAmount").innerText =
        money(gstAmount);

    document.getElementById("finalAmount").innerText =
        money(amount);

    document.getElementById("result").style.display =
        "block";

}


function resetCalculator(){

    document.getElementById("amount").value = "";

    document.getElementById("gst").value = "18";

    document.getElementById("result").style.display =
        "none";

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script><script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
