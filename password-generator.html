<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - Quick Tool</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin:0 0 8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.settings{
    margin-top:20px;
}

.setting-group{
    margin-bottom:20px;
}

.setting-group label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

.length-row{
    display:flex;
    align-items:center;
    gap:12px;
}

input[type="range"]{
    flex:1;
    accent-color:#6c5ce7;
}

.length-value{
    min-width:55px;
    text-align:center;
    padding:9px 8px;
    border-radius:10px;
    background:#eeeaff;
    font-weight:bold;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.option{
    display:flex;
    align-items:center;
    gap:9px;
    padding:13px;
    background:#f7f7ff;
    border-radius:13px;
    cursor:pointer;
}

.option input{
    width:18px;
    height:18px;
    accent-color:#6c5ce7;
}

.generate-btn{
    width:100%;
    border:none;
    margin-top:5px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin:0 0 15px;
}

.password-box{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

#password{
    flex:1;
    min-width:0;
    border:2px solid #ddd;
    border-radius:13px;
    padding:13px;
    font-size:16px;
    background:white;
    color:#172033;
}

.copy-btn{
    border:none;
    padding:0 18px;
    border-radius:13px;
    background:#00b894;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.strength{
    font-weight:bold;
    margin-bottom:8px;
}

.strength-bar{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.strength-fill{
    height:100%;
    width:0%;
    transition:width .3s, background .3s;
    border-radius:20px;
    background:#e74c3c;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
    margin-top:12px;
}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .option{
    background:#15192a;
}

body.dark .length-value{
    background:#242039;
}

body.dark #password{
    background:#15192a;
    color:white;
    border-color:#444;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-info{
    color:#ccc;
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .password-box{
        flex-direction:column;
    }

    .copy-btn{
        padding:13px;
    }
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<div class="header">

    <div class="header-inner">

        <button
            class="back"
            onclick="window.location.href='Tool.html'"
        >
            ‹
        </button>

        <div class="logo">
            ⚡ Quick Tool
        </div>

    </div>

</div>

<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">
            🔐
        </div>

        <h1>Password Generator</h1>

        <p>
            Create strong and secure passwords instantly.
        </p>

    </div>

    <div class="settings">

        <div class="setting-group">

            <label>
                Password Length
            </label>

            <div class="length-row">

                <input
                    type="range"
                    id="length"
                    min="4"
                    max="50"
                    value="16"
                    oninput="updateLength()"
                >

                <div
                    class="length-value"
                    id="lengthValue"
                >
                    16
                </div>

            </div>

        </div>

        <div class="setting-group">

            <label>
                Password Options
            </label>

            <div class="options">

                <label class="option">

                    <input
                        type="checkbox"
                        id="uppercase"
                        checked
                    >

                    <span>
                        Uppercase (A-Z)
                    </span>

                </label>

                <label class="option">

                    <input
                        type="checkbox"
                        id="lowercase"
                        checked
                    >

                    <span>
                        Lowercase (a-z)
                    </span>

                </label>

                <label class="option">

                    <input
                        type="checkbox"
                        id="numbers"
                        checked
                    >

                    <span>
                        Numbers (0-9)
                    </span>

                </label>

                <label class="option">

                    <input
                        type="checkbox"
                        id="symbols"
                        checked
                    >

                    <span>
                        Symbols (!@#)
                    </span>

                </label>

            </div>

        </div>

        <button
            class="generate-btn"
            onclick="generatePassword()"
        >
            🔑 Generate Password
        </button>

    </div>

    <div
        class="result"
        id="result"
    >

        <h2>
            Your Password
        </h2>

        <div class="password-box">

            <input
                type="text"
                id="password"
                readonly
            >

            <button
                class="copy-btn"
                onclick="copyPassword()"
            >
                Copy
            </button>

        </div>

        <div
            class="strength"
            id="strength"
        >
            Strength: —
        </div>

        <div class="strength-bar">

            <div
                class="strength-fill"
                id="strengthFill"
            ></div>

        </div>

        <div
            class="result-info"
            id="resultInfo"
        ></div>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>


<script>

function updateLength(){

    const length =
        document.getElementById("length").value;

    document.getElementById("lengthValue")
        .textContent = length;
}


function generatePassword(){

    const length =
        parseInt(
            document.getElementById("length").value
        );

    const uppercase =
        document.getElementById("uppercase").checked;

    const lowercase =
        document.getElementById("lowercase").checked;

    const numbers =
        document.getElementById("numbers").checked;

    const symbols =
        document.getElementById("symbols").checked;


    let chars = "";


    if(uppercase){

        chars +=
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    }


    if(lowercase){

        chars +=
            "abcdefghijklmnopqrstuvwxyz";

    }


    if(numbers){

        chars +=
            "0123456789";

    }


    if(symbols){

        chars +=
            "!@#$%^&*()_+-=[]{}|;:,.<>?";

    }


    if(chars === ""){

        alert(
            "Please select at least one password option."
        );

        return;

    }


    let password = "";


    const randomArray =
        new Uint32Array(length);

    crypto.getRandomValues(randomArray);


    for(let i = 0; i < length; i++){

        password +=
            chars[
                randomArray[i] % chars.length
            ];

    }


    document.getElementById("password")
        .value = password;


    calculateStrength(password);


    document.getElementById("result")
        .style.display = "block";

}


function calculateStrength(password){

    let score = 0;


    if(password.length >= 8)
        score++;

    if(password.length >= 12)
        score++;

    if(password.length >= 16)
        score++;


    if(/[A-Z]/.test(password))
        score++;

    if(/[a-z]/.test(password))
        score++;

    if(/[0-9]/.test(password))
        score++;

    if(/[^A-Za-z0-9]/.test(password))
        score++;


    let text = "";
    let width = 0;
    let color = "";


    /* 🔴 WEAK */

    if(score <= 2){

        text = "Strength: Weak";
        width = 30;
        color = "#e74c3c";

    }


    /* 🟡 MEDIUM */

    else if(score <= 4){

        text = "Strength: Medium";
        width = 60;
        color = "#f1c40f";

    }


    /* 🟢 STRONG */

    else if(score <= 6){

        text = "Strength: Strong";
        width = 80;
        color = "#2ecc71";

    }


    /* 🟢 VERY STRONG */

    else{

        text = "Strength: Very Strong";
        width = 100;
        color = "#00a77d";

    }


    document.getElementById("strength")
        .textContent = text;


    const fill =
        document.getElementById("strengthFill");


    fill.style.width =
        width + "%";

    fill.style.background =
        color;


    document.getElementById("resultInfo")
        .innerHTML =
            "Length: " +
            password.length +

            "<br>Characters available: " +
            getCharacterCount() +

            "<br>Generated locally in your browser.";

}


function getCharacterCount(){

    let count = 0;


    if(
        document.getElementById("uppercase").checked
    ){

        count += 26;

    }


    if(
        document.getElementById("lowercase").checked
    ){

        count += 26;

    }


    if(
        document.getElementById("numbers").checked
    ){

        count += 10;

    }


    if(
        document.getElementById("symbols").checked
    ){

        count +=
            "!@#$%^&*()_+-=[]{}|;:,.<>?".length;

    }


    return count;

}


async function copyPassword(){

    const password =
        document.getElementById("password").value;


    if(!password){

        return;

    }


    try{

        await navigator.clipboard
            .writeText(password);


        const btn =
            document.querySelector(".copy-btn");

        const oldText =
            btn.textContent;


        btn.textContent =
            "Copied!";


        setTimeout(()=>{

            btn.textContent =
                oldText;

        },1500);


    }catch(error){

        const input =
            document.getElementById("password");


        input.select();

        document.execCommand("copy");


        alert(
            "Password copied!"
        );

    }

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
