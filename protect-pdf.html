<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Protect PDF - Quick Tool</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#f4f6ff;
    color:#172033;
    padding-bottom:30px;
    font-family:Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    padding:18px 16px 30px;
    border-radius:0 0 30px 30px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header-inner{
    max-width:750px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:28px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.container{
    max-width:750px;
    margin:-15px auto 0;
    padding:0 15px;
}

.box{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title-icon{
    width:70px;
    height:70px;
    margin:0 auto 14px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#eeeaff;
}

.title h1{
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
    line-height:1.5;
}

.upload{
    display:block;
    text-align:center;
    border:2px dashed #6c5ce7;
    border-radius:10px;
    padding:35px 15px;
    background:#faf9ff;
    cursor:pointer;
}

.upload-icon{
    font-size:45px;
    margin-bottom:8px;
}

.upload strong{
    display:block;
    font-size:17px;
    margin-bottom:7px;
}

.upload small{
    color:#888;
    font-size:12px;
}

#file{
    display:none;
}

.info{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:10px;
    background:#f5f3ff;
    text-align:center;
    font-size:14px;
    line-height:1.7;
}

.settings{
    display:none;
    margin-top:20px;
}

.settings label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

.password-box{
    position:relative;
}

.password-box input{
    width:100%;
    padding:15px;
    padding-right:55px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
}

.password-box input:focus{
    border-color:#6c5ce7;
}

.show-password{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;
    background:#eeeaff;
    cursor:pointer;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    padding:0;
}

.action-btn{
    display:none;
    width:100%;
    border:none;
    margin-top:20px;
    padding:16px;
    border-radius:17px;
    background:linear-gradient(135deg,#6c5ce7,#00b894);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#eafff7;
    text-align:center;
}

.result h2{
    color:#00a77d;
    font-size:20px;
    margin-bottom:10px;
}

.result-info{
    color:#555;
    font-size:14px;
    line-height:1.8;
}

@media(max-width:500px){

    .header{
        padding-bottom:28px;
    }

    .box{
        padding:22px 16px;
    }

    .title h1{
        font-size:23px;
    }

    .upload{
        padding:30px 10px;
    }

}

body.dark{
    background:#101321;
    color:white;
}

body.dark .box{
    background:#191d2d;
}

body.dark .title p{
    color:#aaa;
}

body.dark .upload{
    background:#15192a;
    border-color:#8075ef;
}

body.dark .upload small{
    color:#aaa;
}

body.dark .info{
    background:#242039;
}

body.dark .password-box input{
    background:#15192a;
    color:white;
    border-color:#444;
}

body.dark .result{
    background:#102b25;
}

body.dark .result-info{
    color:#ccc;
}
/* ============================= */
/* DESKTOP RESPONSIVE FIX */
/* ALL QUICK TOOL PAGES */
/* ============================= */

@media (min-width: 900px){

    body{
        padding-bottom:50px;
    }

    .header{
        padding:24px 30px 40px;
        border-radius:0 0 40px 40px;
    }

    .header-inner{
        max-width:1200px;
        gap:20px;
    }

    .back{
        width:56px;
        height:56px;
        font-size:34px;
    }

    .logo{
        font-size:30px;
    }

    .container{
        max-width:1200px;
        padding:0 25px;
        margin:-20px auto 0;
    }

    .box{
        width:100%;
        padding:40px;
        border-radius:30px;
    }

    .title h1{
        font-size:38px;
    }

    .title p{
        font-size:18px;
    }

    /* Common tool content */

    .input-group,
    .tool-content,
    .tool-area,
    .form-container,
    .generator,
    .converter,
    .result-box,
    .values{
        width:100%;
    }

}
@media (min-width:900px){

    .color-square,
    .hue-slider{
        max-width:850px;
    }

    .color-square{
        height:350px;
    }

}
</style>
<link rel="stylesheet" href="tool-suggestions.css">
<link rel="stylesheet" href="intro-footer.css">
</head>

<body>

<header class="header">

    <div class="header-inner">

        <button class="back" onclick="goHome()">‹</button>

        <div class="logo">⚡ Quick Tool</div>

    </div>

</header>


<div class="container">

<div class="box">

    <div class="title">

        <div class="title-icon">🔒</div>

        <h1>Protect PDF</h1>

        <p>Add password protection to your PDF file.</p>

    </div>


    <label class="upload" for="file">

        <div class="upload-icon">📄</div>

        <strong>Select PDF File</strong>

        <small>Choose the PDF you want to protect</small>

    </label>

    <input type="file" id="file" accept="application/pdf">


    <div class="info" id="info"></div>


    <div class="settings" id="settings">

        <label>Enter Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter PDF password"
            >

            <button
                class="show-password"
                onclick="togglePassword()"
                type="button"
            ><span id="eyeIcon">🙈</span></button>

        </div>

    </div>


    <button
        class="action-btn"
        id="protectBtn"
        onclick="protectPDF()"
    >
        Protect PDF
    </button>


    <div class="result" id="result">

        <h2 id="resultTitle">PDF Protection</h2>

        <div
            class="result-info"
            id="resultInfo"
        ></div>

    </div>

</div>
<div id="toolSuggestions" class="tool-suggestions"></div>
<div id="introSection"></div>
</div>
<footer class="site-footer">
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <p>© 2026 Quick Tool. All rights reserved.</p>
</footer>

<script>

/* BACK BUTTON */

function goHome(){

    window.location.href="Tool.html";

}


/* VARIABLES */

const fileInput = document.getElementById("file");

const info = document.getElementById("info");

const settings = document.getElementById("settings");

const password = document.getElementById("password");

const protectBtn = document.getElementById("protectBtn");

const result = document.getElementById("result");

const resultTitle = document.getElementById("resultTitle");

const resultInfo = document.getElementById("resultInfo");

let selectedFile = null;


/* SELECT PDF */

fileInput.addEventListener("change", function(){

    selectedFile = this.files[0];

    if(!selectedFile){

        return;

    }

    info.style.display = "block";

    info.innerHTML =
        "📄 File: <strong>" +
        selectedFile.name +
        "</strong><br>" +
        "📦 Original Size: <strong>" +
        (selectedFile.size / 1024 / 1024).toFixed(2) +
        " MB</strong>";


    settings.style.display = "block";

    protectBtn.style.display = "block";

    result.style.display = "none";

    password.value = "";

});


/* SHOW / HIDE PASSWORD */

function togglePassword(){

    if(password.type === "password"){

        password.type = "text";
        document.getElementById("eyeIcon").innerText = "👁️";

    }else{

        password.type = "password";
        document.getElementById("eyeIcon").innerText = "🙈";

    }

}


/* PROTECT */

async function protectPDF(){

    if(!selectedFile){

        return;

    }


    const pass = password.value.trim();


    if(pass.length < 4){

        result.style.display = "block";

        resultTitle.innerText = "Password Required";

        resultInfo.innerHTML =
            "Please enter a password of at least 4 characters.";

        return;

    }


    const originalBtnText = protectBtn.innerText;

    protectBtn.disabled = true;

    protectBtn.innerText = "Protecting...";

    result.style.display = "none";


    try{

        const arrayBuffer = await selectedFile.arrayBuffer();

        const { encryptPDF } = await import(
            "https://esm.sh/@pdfsmaller/pdf-encrypt-lite"
        );

        const encryptedBytes = await encryptPDF(
            new Uint8Array(arrayBuffer),
            pass
        );

        const blob = new Blob(
            [encryptedBytes],
            { type: "application/pdf" }
        );

        const url = URL.createObjectURL(blob);

        const downloadName =
            selectedFile.name.replace(/\.pdf$/i, "") +
            "-protected.pdf";

        result.style.display = "block";

        resultTitle.innerText = "PDF Protected Successfully";

        resultInfo.innerHTML =
            "Your PDF is now password protected.<br>" +
            "You'll need the password to open it.<br><br>" +
            "<a href=\"" + url + "\" download=\"" + downloadName + "\" " +
            "class=\"action-btn\" " +
            "style=\"display:block;text-decoration:none;" +
            "line-height:1.4;\">⬇️ Download Protected PDF</a>";

    }catch(err){

        result.style.display = "block";

        resultTitle.innerText = "Something Went Wrong";

        resultInfo.innerHTML =
            "Could not protect this PDF. " +
            "Please try a different file or password.<br><br>" +
            "<small>" + (err && err.message ? err.message : "") + "</small>";

    }finally{

        protectBtn.disabled = false;

        protectBtn.innerText = originalBtnText;

    }

}

/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
/* DARK MODE */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark");

}
</script>
<script src="tool-suggestions.js"></script>
<script>
fetch("intro.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("introSection").innerHTML = html;
    });
</script>
</body>
</html>
